<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>화면③ 자동화 상세 — as-is 시안</title>

<base href="../컴포넌트/">
<link rel="stylesheet" href="common/common.css">
<link rel="stylesheet" href="../화면/_공용.css">
<script src="../화면/_뼈대.js" defer></script>
<script src="../화면/부품/상단바/_상단바.js"></script><!-- 상단 바 한 벌 — defer 를 쓰면 화면 인라인 스크립트가 먼저 돌아 못 찾는다 --><!-- 자동화 영역 공용 부품 — 컴포넌트 목록 50~58. 고치면 이 ?v= 를 올릴 것 -->
<style>
/* ── 화면③ 자동화 상세 — 3기둥(결정 6xxx 화면③ 구간 · LAB 상세3기둥 P-1~P-5 · 실행상세 R-2g · 상세상태 S-1~S-4) ──
   왼쪽 단 240px = 이 자동화 안의 메뉴(홈 · 실행 이력 · 설정). 오른쪽 = 고른 것. 작성 화면(화면② 삼단)과 폭·바탕이 같다 */
.body > .main{flex:1; min-width:0; display:flex; flex-direction:column;}   /* 화면①과 같은 값 — 없으면 본문이 내용 폭으로 줄어든다 */
/* 2026-09-19 — 왼쪽 단과 오른쪽이 **각자 스크롤**한다(사용자). 그래서 바깥은 안 굴리고(overflow:hidden)
   왼쪽은 실행 이력 목록만, 오른쪽은 본문이 굴러간다. 「‹ 전체 목록」·홈·바닥 「설정」은 늘 제자리 */
.content{display:block; min-height:0; overflow:hidden; flex:1;}
.p-page{display:grid; grid-template-columns:240px minmax(0,1fr); height:100%; min-height:0; position:relative;}
.p-page:before{content:""; position:absolute; left:0; top:0; bottom:0; width:240px; background:#fbfbfb; border-right:1px solid var(--border-default);}
/* 왼쪽 단 */
.pn{position:relative; padding:16px 12px 20px; display:flex; flex-direction:column; min-height:0; box-sizing:border-box;}
.pn-back{font-size:12px; color:var(--gray-500); padding:0 8px 16px; cursor:pointer; display:flex; align-items:center; gap:4px;}
.pn-back:hover{color:var(--black-900);}
.pn-home{display:flex; align-items:center; gap:6px; padding:8px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; color:var(--color-n-800);}
.pn-home.on{background:var(--color-lnb-selected,#eef2ff);} .pn-home:hover:not(.on){background:rgba(0,0,0,.04);}
.pn-home .dot{width:6px; height:6px; border-radius:50%; flex:0 0 auto; background:#22c55e;}
.pn-home .dot.off{background:#a8afbc;} .pn-home .dot.fail{background:#ef4444;} .pn-home .dot.draft{background:#fff; border:1px solid #a8afbc; box-sizing:border-box;}
.pn-home .dot.run{background:#22c55e; animation:p-blink .85s ease-in-out infinite alternate;}
@keyframes p-blink{from{opacity:1}to{opacity:.3}}
.pn-lb{font-size:11px; font-weight:600; color:var(--gray-500); margin:20px 8px 6px; display:flex; gap:6px; align-items:center;} .pn-cnt{font-weight:400;}
.pn-list{display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-height:0; overflow-y:auto;}   /* 이력은 전부 들어오고 여기만 굴러간다(2026-09-19) */
.pn-row{display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:6px; font-size:12px; cursor:pointer; color:var(--color-n-800);}
.pn-row:hover{background:rgba(0,0,0,.04);} .pn-row.on{background:var(--color-lnb-selected,#eef2ff);}
.pn-row .pr-s{font-size:11px; color:var(--gray-500);} .pn-row .pr-s.fail{color:#dc2626;} .pn-row .pr-s.live{color:#16a34a; font-weight:600;}
.pn-row.live .pr-d{color:#16a34a; font-weight:600;}
/* .pn-more(「모두 보기」)는 2026-09-19 에 없앴습니다 — 이력이 목록에 전부 들어오고 .pn-list 가 스스로 굴러갑니다 */
.pn-empty{font-size:11px; color:var(--gray-400); padding:6px 8px;}
/* 조작 버튼 셋 — 2026-09-20 결정 4004. 자리는 **자동화 이름 바로 아래**다(사용자:
   "민원 답변 작성 아래에 버튼 3개 세트가 들어가고 그 아래에 실행 이력이 들어가는 건?").
   한 번 왼쪽 단 바닥에 두었다가 올렸다 — 이름 · 조작 · 이력이 위에서 아래로 한 흐름이 된다 */
.pn-ctl{display:flex; flex-direction:column; gap:6px; margin:10px 0 4px;}
.pn-ctl .b{width:100%; justify-content:center;}
.pn-ctl:empty{display:none;}
/* 오른쪽 */
.p-right{padding:16px 24px 24px; min-width:0; font-size:13px; color:var(--color-n-800); overflow-y:auto; min-height:0; box-sizing:border-box;}
/* 본문 폭 상한 960 — 결정 4004(LAB 상세홈 H-1). 「단계별 실행」 표에 준 값과 같게 맞춰 한 화면에 두 폭이 생기지 않게 한다.
   스크롤 막대는 오른쪽 끝에 그대로 두려고 칸을 좁히지 않고 안의 것만 묶는다. 사용자: "카드가 좀 멀어 보인달까" */
.p-right > *{max-width:960px;}
.b{height:28px; padding:0 10px; font-size:12px; border:1px solid var(--border-default); border-radius:6px; background:#fff; color:var(--color-n-800); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit;}
.b:hover{background:rgba(0,0,0,.03);} .b.primary{background:var(--brand-primary); border-color:var(--brand-primary); color:#fff;} .b.danger{color:#dc2626; border-color:#fecaca;}
.sp{flex:1;} .muted{color:var(--gray-500); font-size:12px;} .lnk{color:var(--brand-primary); cursor:pointer;}   /* 2026-09-21 — 하드코딩 #235edf 를 라이브러리 토큰으로 */
.bh-name{font-size:18px; font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.bh-name .tpl-badge{font-size:10px; color:var(--gray-600); background:#fff; border:1px solid var(--border-default); padding:1px 6px; border-radius:4px;}
.bh-desc{font-size:13px; color:var(--gray-600); margin-top:4px;}
.bh-st{display:flex; gap:8px; align-items:center; margin:12px 0 18px; font-size:12px; flex-wrap:wrap;}
.bh-st .dot{width:6px; height:6px; border-radius:50%; background:#22c55e;} .bh-st .dot.off{background:#a8afbc;} .bh-st .dot.fail{background:#ef4444;} .bh-st .dot.draft{background:#fff; border:1px solid #a8afbc; box-sizing:border-box;} .bh-st .dot.run{animation:p-blink .85s ease-in-out infinite alternate;}
/* 위 18 — 결정 4004 로 상태 줄(.bh-st · margin 12/18)을 없애면서 설명과 카드가 딱 붙어 버렸다. 그 줄이 맡던 아래 여백을 여기로 옮긴다 */
.sum{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:18px 0 22px;}
.sum-i{border:1px solid var(--border-default); border-radius:8px; padding:10px 14px;} .sum-k{font-size:11px; color:var(--gray-500);} .sum-v{font-size:16px; font-weight:600; margin-top:2px;} .sum-v small{font-size:11px; font-weight:400; color:var(--gray-500); margin-left:3px;} .sum-v.ok{font-size:13px; color:#16a34a;} .sum-v.bad{font-size:13px; color:#dc2626;}
.sec-hd{display:flex; align-items:center; gap:10px; margin:0 0 10px;} .sec-t{font-size:14px; font-weight:600;}
/* 2026-09-20 · 결정 4005(LAB 하는일 **K-1 채택**) — 하는 일이 다섯 개가 아닐 수 있다(사용자).
   전에는 `repeat(5, …)` 로 못 박혀 3개면 오른쪽이 비고 7·9개면 둘째 줄이 어정쩡했다.
   **180** 은 다섯 칸의 지금 폭(920÷5≈184)보다 조금 낮은 값이라 5개일 때는 지금과 똑같이 한 줄로 떨어지고,
   3개면 빈 트랙이 접혀 셋이 넓어진다. 화면① 템플릿 격자(`.gal`)가 이미 쓰는 방식이다 */
.steps5{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-bottom:22px;}
.s5{display:flex; gap:8px; align-items:flex-start; border:1px solid var(--border-subtle); border-radius:8px; padding:10px; min-width:0;}
.s5 .rs-n{font-size:12px; font-weight:600;} .s5 .rs-d{font-size:11px; color:var(--gray-500); margin-top:2px; line-height:1.5; word-break:break-all;} .s5.fail .rs-d{color:#dc2626;} .s5.todo .rs-d{color:var(--gray-400);}
.rs-i{flex:0 0 18px; width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; border:1px solid var(--border-default); color:var(--gray-500); background:#fff;}
.rs-i svg{width:11px; height:11px;} .rs-i.ok{background:#ecfdf5; border-color:#16a34a; color:#16a34a;} .rs-i.fail{background:#fee2e2; border-color:#ef4444; color:#dc2626; font-weight:700;} .rs-i.skip{color:var(--gray-400);} .rs-i.todo{background:var(--color-n-800); border-color:var(--color-n-800); color:#fff;} .rs-i.run{border-color:#22c55e;} .rs-i.idle{color:var(--gray-400);} .rs-i.num{color:var(--gray-500);}   /* num = 평소의 단계 번호(결정 4005) */
.spin{display:inline-block; width:10px; height:10px; border:1.5px solid #22c55e; border-top-color:transparent; border-radius:50%; animation:p-rot 1s linear infinite;}
@keyframes p-rot{to{transform:rotate(360deg)}}
/* 실행 하나 */
/* 실행 하나의 제목 줄 — 2026-09-20. 전에는 클래스 이름이 `.hd` 라 **공용 `.hd`(제품 상단 바)** 의
   `height:45px · padding:0 20px · border-bottom` 을 그대로 물려받아 제목만 왼쪽으로 20px 밀려 있었다(이름 충돌).
   `.run-hd` 로 가르고, 아래 가로줄도 없앴다(사용자). 제목은 「26.09.12 09:00 완료」처럼 시각이 앞에 온다 */
.run-hd{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.run-hd .t-when{font-size:15px; font-weight:600; color:var(--color-n-800); font-variant-numeric:tabular-nums;}
.run-hd .t{font-size:15px; font-weight:600;} .run-hd .t.fail{color:#dc2626;} .run-hd .t.live{color:#16a34a;}
.dim{color:var(--gray-500); font-size:12px; font-weight:400;}
/* [요약 | 자세히] 세그먼트(.seg-row/.seg/.seg-b)는 2026-09-19 에 걷었습니다 — 실행 하나는 한 장뿐입니다 */
/* 무엇을 했나 한 줄 — 결과 상자 바로 위 */
/* 결과 상자 머리 — 상자 **안** 맨 위에 놓이고 옅은 선으로 본문과 갈린다(2026-09-21) */
.rc-what{font-size:12px; color:var(--gray-600); padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid var(--border-default);}
.rc-what b{font-weight:600; color:var(--color-n-800);}
.rc-body{font-size:13px; line-height:1.8;}
.lb{font-size:11px; font-weight:600; color:var(--gray-500); margin:14px 0 6px;} .lb-first{margin-top:4px;} .lb-gap{margin-top:26px;}
.tl{position:relative;} .tl-row{display:grid; grid-template-columns:18px minmax(0,1fr); gap:0 10px; padding:6px 0; position:relative;}
.tl-row:not(:last-child):before{content:""; position:absolute; left:9px; top:26px; bottom:-6px; width:1px; background:var(--border-default);}
.rs-n{font-size:12px; font-weight:600;} .tl-row.skip .rs-n,.tl-row.idle .rs-n{color:var(--gray-400); font-weight:500;} .rs-d{font-size:11px; color:var(--gray-500); line-height:1.5; margin-top:2px;} .tl-row.fail .rs-d{color:#dc2626;} .tl-act{margin-top:8px;}
/* 결과 본문 — 2026-09-20 결정 4004 로 **폭을 좌우로 채운다**(전에는 max-width:760). 본문 자체가 960 상한 안에 있다(사용자) */
.rc-doc{font-size:13px; line-height:1.8; background:#fbfbfb; border:1px solid var(--border-subtle); border-radius:6px; padding:12px 14px;} .rc-doc.muted{color:var(--gray-500); text-align:center; font-size:12px;}
.run-more{margin-top:12px;}   /* 「자세히」는 결과 아래 맨 끝(결정 4004) */
/* .rc-link(「# 민원-검토 에서 보기」)는 결정 4004 로 없앴습니다 */
.box{border:1px solid var(--border-default); border-radius:8px; padding:4px 10px 6px; background:#fff;}
.tbl{width:100%; border-collapse:collapse; font-size:12px;} .tbl th{font-size:11px; color:var(--gray-500); font-weight:600; text-align:left; padding:6px 8px 2px;} .tbl td{padding:9px 8px; border-bottom:1px solid var(--border-subtle); vertical-align:top;} .box tr:last-child td{border-bottom:0;}
.tbl td.num{color:var(--gray-400); width:20px;} .tbl td.nm{font-weight:600; white-space:nowrap;} .tbl td.ts{white-space:nowrap; color:var(--gray-600); font-variant-numeric:tabular-nums;} .tbl td.res{width:46%;}
.tbl tr.fail td.nm,.tbl tr.fail td.res,.tbl tr.fail td.ts{color:#dc2626;} .tbl tr.skip td,.tbl tr.idle td{color:var(--gray-400);} .tbl tr.fail .lnk{color:var(--brand-primary); margin-left:4px;}
.tbl-kv{max-width:760px;} .tbl-kv td.k{color:var(--gray-500); width:110px; white-space:nowrap;}

/* ── 「단계별 실행」 표 — LAB 실행표 E-2 채택(결정 4003 · 2026-09-19) ──────────────────
   표 규격은 컴포넌트 34-tbl `.tbl-table` 실측값 그대로(머리글 Gray/100 · 11/600 · 5px 10px ·
   칸은 border-top 만). 세부 정보 표(.tbl-kv)는 건드리지 않으려고 .t-step 으로 가둔다 */
.boxcap{max-width:960px; margin-right:auto;}   /* "좌우로 너무 넓다" — 2026-09-17 LAB R-2 와 같은 값 */
.t-step{table-layout:fixed;}
.t-step th{background:var(--color-primitive-gray-100,#f3f4f6); color:#222; font-size:11px; font-weight:600;
  padding:5px 10px; border-top:1px solid var(--border-default); border-bottom:1px solid var(--border-default);}
.t-step td{background:#fff; padding:11px 9px; border-top:1px solid var(--border-default); border-bottom:0;
  vertical-align:middle;}                       /* 세로 가운데 — 결과가 두 줄이어도 단계·상태가 가운데에 선다 */
.t-step tbody tr:first-child td{border-top:0;}
.t-step th:nth-child(3), .t-step td.stt{padding-right:20px;}   /* 상태 ↔ 결과 사이를 벌린다 */
.t-step td.res{width:auto; white-space:normal; word-break:keep-all;}
.t-step td.nm{white-space:normal;}
.t-step tr.fail td{background:#fff;}            /* 실패 줄에 배경은 깔지 않는다 — 글자 색만(사용자) */
.box:has(.t-step){padding:0;}
.none{color:var(--gray-400);}

/* 상태 뱃지 — 라이브러리 `.state-badge` 규격(11/500 · 3px 8px · radius 5).
   is-active(성공)·is-inactive(건너뜀)·is-draft(대기)는 라이브러리 값 그대로.
   **is-fail·is-run 은 라이브러리에 없어 여기서 만든 변형입니다 — 디자인 단계에서 컴포넌트로 올릴 것**
   (as-is 에서는 `컴포넌트/` 를 고치지 않는다 · 작업 규칙 5.2). 라이브러리 주석대로 색만이 아니라
   채움/테두리로도 갈리게 두어 색각 이상에서도 구분됩니다 */
.state-badge{font-size:11px; font-weight:500; letter-spacing:-0.5px; padding:3px 8px; border-radius:5px;
  border:1px solid transparent; display:inline-block; white-space:nowrap;}
.state-badge.is-active{background:#dcfce7; color:#15803d;}
.state-badge.is-inactive{background:var(--color-primitive-gray-100,#f3f4f6); color:var(--gray-600);}
.state-badge.is-draft{background:transparent; color:var(--gray-600); border-color:var(--border-default);}
.state-badge.is-fail{background:#fee2e2; color:#dc2626;}
.state-badge.is-run{background:transparent; color:#15803d; border-color:#86c9a8;}
.st-empty{border:1px dashed var(--border-default); border-radius:8px; padding:28px; text-align:center; margin:18px 0 22px;}   /* 위 18 — .sum 과 같은 값(설정 중 상태에서 설명 줄 다음에 오는 것) */ .em-t{font-size:14px; font-weight:600; margin-bottom:6px;} .em-d{font-size:12px; color:var(--gray-600); margin-bottom:14px; line-height:1.6;}
/* 알림 띠 — 실패든 직접 끔이든 **회색 한 가지**다(2026-09-20 사용자). 노란 경고는 쓰지 않는다 */
.warn{background:#f8fafc; border:1px solid var(--border-default); color:var(--gray-600); border-radius:8px; padding:10px 14px; font-size:12px; margin:18px 0 16px; line-height:1.6;}   /* 위 18 — .sum 과 같은 값(실패 상태에서 설명 줄 다음에 오는 것) */
/* 시안 조작(상태 바꿔 보기) */
.demo{position:fixed; right:16px; bottom:16px; display:flex; gap:4px; align-items:center; background:#fff; border:1px solid var(--border-default); border-radius:8px; padding:6px 8px; font-size:11px; color:var(--gray-500); box-shadow:0 2px 8px rgba(0,0,0,.08); z-index:50;}
.demo button{height:22px; padding:0 8px; border:0; border-radius:4px; background:transparent; font-size:11px; cursor:pointer; color:var(--gray-600); font-family:inherit;} .demo button.on{background:var(--color-n-800); color:#fff;}
</style></head><body>
<div class="app">
<div class="gnb"><div class="g-item"><img src="assets/ico-gnb-aiChat.svg" alt=""><span>AI 채팅</span></div><div class="g-item"><img src="assets/ico-gnb-cowork.svg" alt=""><span>협업</span></div><div class="g-item"><img src="assets/ico-gnb-document.svg" alt=""><span>지식/문서</span></div><div class="g-item"><img src="assets/ico-gnb-mail.svg" alt=""><span>이메일</span></div><div class="g-item on"><img src="assets/ico-workflow-active.svg" alt=""><span>자동화</span><!-- 라이브러리엔 ico-gnb-workflow-active 가 없음. 이름 규칙 정리는 디자인 단계에서 --></div><div class="g-item"><img src="assets/ico-gnb-dashboard.svg" alt=""><span>프로젝트</span></div><div class="g-item"><img src="assets/ico-gnb-office.svg" alt=""><span>데이터 분석</span></div><div class="g-item"><img src="assets/ico-gnb-system.svg" alt=""><span>관리</span></div><div class="g-item"><img src="assets/ico-gnb-system02-active.svg" alt=""><span>시스템</span></div></div>
<div class="main">
  <div class="hd"><span class="logo">Prixm AI:CREW</span><span class="sp"></span><img src="assets/ico-bell.svg" style="width:18px"><span style="font-size:12px;">박준형</span></div>
  <div class="body">
    <div class="lnb-panel">

  }).join('');
}

// ── 오른쪽 — 홈 ───────────────────────────────────────────────────────────
// 하는 일 칸의 표 — 2026-09-20 · 결정 4005(LAB 하는일 **J-4 채택**).
//   사용자: "완료된 상태에서 체크 표시되어 있을 필요가 있나??" → 다 채워진 자동화는 다섯이 전부 같은 체크라
//   아무것도 구분해 주지 않았고, 「하는 일 · **설정**」 자리인데 체크가 "실행이 잘 됐다"로도 읽혔다.
//   그래서 **번호가 기본**이고, **체크는 「이번 실행에서 끝났다」는 뜻으로만** — 즉 실행 중일 때만 쓴다.
function stepMarks(){
  return AUTO.steps.map((s,i)=>{
    let k='ok', v=s[1];
    if(state==='fail' && i===2){ k='fail'; v=s[1]+' · 접근 불가'; }
    if(state==='setup' && (i===0||i===3)){ k='todo'; v='아직 고르지 않음'; }
    if(state==='run'){ k = i<2?'ok': i===2?'run':'idle'; }
    let ico, cls=k;
    if(k==='ok'){ if(state==='run'){ ico=CHK; } else { ico=String(i+1); cls='num'; } }   // 체크는 실행 중에만
    else if(k==='fail') ico='!';
    else if(k==='run')  ico=SPIN;
    else ico=String(i+1);                                                                 // todo(진한 번호) · idle(흐린 번호)
    return '<div class="s5 '+k+'"><span class="rs-i '+cls+'">'+ico+'</span><div><div class="rs-n">'+s[0]+'</div><div class="rs-d">'+v+'</div></div></div>';
  }).join('');
}
function renderHome(){

  // 상태 줄(.bh-st)은 결정 4004 로 없앴다 — 상태는 왼쪽 단 홈 항목의 점이 말하고, 조작은 그 단 바닥 버튼이 맡는다
  let h='<div class="bh-name">'+AUTO.name+' '+AUTO.tags.map(t=>'<span class="tpl-badge">'+t+'</span>').join('')+'</div><div class="bh-desc">'+AUTO.desc+'</div>';
  // 날짜는 마지막 실행에서 가져온다 — 손으로 적어 두면 데모 값과 어긋난다(2026-09-20에 실제로 어긋나 있었다)
  if(state==='fail') h+='<div class="warn">'+lr.date+' '+lr.start.slice(9,14)+' 실행이 '+lr.stop+'에서 실패해 자동 실행이 꺼졌습니다. 원인을 고친 뒤 <b>켜기</b>를 누르면 다시 감시를 시작합니다.</div>';
  if(state==='off') h+='<div class="warn off">자동 실행이 꺼져 있습니다. 새 메일이 와도 돌지 않습니다. <b>켜기</b>를 누르면 다시 감시를 시작합니다.</div>';
  if(state==='setup'){
    h+='<div class="st-empty"><div class="em-t">아직 설정이 끝나지 않았습니다</div><div class="em-d"><b>수신 이메일 계정</b>과 <b>AI 직원</b>을 아직 안 골랐습니다. 채우고 저장하면 바로 켜집니다.</div><button class="b primary js-settings">설정 이어서 하기</button></div>';
    h+='<div class="sec-hd"><span class="sec-t">하는 일</span></div><div class="steps5">'+stepMarks()+'</div>';
    $('.js-right').innerHTML=h; return;
  }
  h+='<div class="sum"><div class="sum-i"><div class="sum-k">누적 실행</div><div class="sum-v">128<small>회</small></div></div><div class="sum-i"><div class="sum-k">최근 30일</div><div class="sum-v">41<small>회 · 실패 2</small></div></div>'
    +'<div class="sum-i"><div class="sum-k">'+(state==='run'?'지금':'마지막 실행')+'</div><div class="sum-v '+(state==='run'?'ok':lr.st==='ok'?'ok':'bad')+'">'+(state==='run'?'실행 중 · 14:32 시작':lr.date+' '+lr.start.slice(9,14)+' · '+(lr.st==='ok'?'완료':'실패'))+'</div></div></div>';
  // 2026-09-20 · 결정 4004 — 머리의 「설정 고치기」는 뺐다. 설정은 왼쪽 단 바닥 버튼 하나로 간다(사용자)
  h+='<div class="sec-hd"><span class="sec-t">하는 일</span></div><div class="steps5">'+stepMarks()+'</div>';
  // 「자세히」는 머리 오른쪽이 아니라 **결과 아래 맨 끝**에 둔다(사용자). 「# 민원-검토 에서 보기」는 뺐다
  // 2026-09-20 · 결정 4005(LAB 하는일 **L-1 채택**) — 사용자: "그럼 J-4가 있는데 뭐 하러
  //   「하는 일 · 설정」하고 「지금 실행 중」이 나와?" 맞는 말이라, **과정뿐인 것은 여기 두지 않는다.**
  //   결과가 있는 실행(완료)만 본문을 펴고, 과정뿐인 것(실행 중 · 실패)은 위 하는 일 칸이 이미 말하므로
  //   「자세히」 버튼으로만 넘긴다 — 같은 다섯 단계를 두 번 그리지 않는다
  const cur = state==='run' ? LIVE : lr, curV = state==='run' ? 'live' : lr.id;
  if(cur.st==='ok') h+='<div class="sec-hd"><span class="sec-t">마지막 실행</span></div>'+runBody(cur);
  h+='<div class="run-more"><button class="b js-nav" data-v="run:'+curV+'">자세히</button></div>';   // 상태와 무관하게 「자세히」 하나로(사용자)
  $('.js-right').innerHTML=h;
}

// ── 오른쪽 — 실행 하나 (요약 ↔ 자세히 · LAB R-2g) ───────────────────────
function ico(k){ return {ok:'<span class="rs-i ok">'+CHK+'</span>', fail:'<span class="rs-i fail">!</span>', skip:'<span class="rs-i skip">–</span>', run:'<span class="rs-i run">'+SPIN+'</span>', idle:'<span class="rs-i idle"></span>'}[k]; }
function procHtml(r){   // 과정 — 단계 이름 · 내용. 시간은 자세히에서
  return '<div class="tl">'+r.steps.map(s=>'<div class="tl-row '+s[2]+'">'+ico(s[2])+'<div><div class="rs-n">'+s[0]+'</div>'+(s[1]?'<div class="rs-d">'+s[1]+'</div>':'')+(s[2]==='fail'?'<div class="tl-act"><button class="b js-settings">설정 열기</button></div>':'')+'</div></div>').join('')+'</div>';
}
function detHtml(r, notFirst){    // 단계별 실행 표(단계 · 결과 · 소요 · 시작 · 종료) + 세부 정보 표. 날짜는 시작·종료 칸에 늘
  const d=r.date;
  // 표의 시각 표현(상태 표 · 소요 막대 …)은 **정본에 바로 넣지 않습니다** — `_lab/실행표_lab.html` 에서 견주는 중입니다(2026-09-19).
  // 여기는 LAB R-2g 로 정해진 맨 표 그대로 둡니다
  // 2026-09-19 · 결정 4003 — LAB `_lab/실행표_lab.html` **E-2 채택**(사용자 "e-2 나쁘지 않은 듯").
  //   ① 「상태」 열을 따로 두고 성공/실패/건너뜀/진행 중/대기를 `.state-badge` 로 말한다(결과 칸은 내용만)
  //   ② 표는 컴포넌트 34-tbl `.tbl-table` 규격(머리글 Gray/100 · 칸은 border-top 만)
  //   ③ 세로 가운데 · 상태 칸 오른쪽 20px · 열 폭 colgroup 고정 · 표 폭 상한 960(2026-09-17 R-2 와 같은 값)
  //   ④ 실패 줄에 배경은 깔지 않는다 — 글자 색만(사용자)
  const rows=r.steps.map((s,i)=>{
    const k=s[2], body=(s[1]||'') || (k==='skip'?'<span class="none">실행되지 않음</span>':k==='idle'?'<span class="none">–</span>':'');
    return '<tr class="'+k+'"><td class="num">'+(i+1)+'</td><td class="nm">'+s[0]+'</td>'
      +'<td class="stt">'+badge(k)+'</td>'
      +'<td class="res">'+body+(k==='fail'?' <span class="lnk js-settings">설정 열기</span>':'')+'</td>'
      +'<td class="ts">'+(s[5]||'–')+'</td><td class="ts">'+(s[3]?d+' '+s[3]:'–')+'</td><td class="ts">'+(s[4]?d+' '+s[4]:'–')+'</td></tr>';
  }).join('');
  const CG='<colgroup><col style="width:28px"><col style="width:132px"><col style="width:76px"><col><col style="width:66px"><col style="width:150px"><col style="width:150px"></colgroup>';
  const info=[['왜 실행됐나',r.why],['실행 방식','자동 (이메일 수신이 시작함)'],['실행한 시간',r.start],['종료한 시간',r.end||'–'],['소요',r.dur||'–'],['실행 ID','run_'+r.id]].concat(r.stop?[['멈춘 곳',r.stop]]:[]);
  return '<div class="lb '+(notFirst?'lb-gap':'lb-first')+'">단계별 실행</div><div class="box boxcap"><table class="tbl t-step">'+CG+'<thead><tr><th></th><th>단계</th><th>상태</th><th>결과</th><th>소요</th><th>시작</th><th>종료</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
       +'<div class="lb lb-gap">세부 정보</div><div class="box"><table class="tbl tbl-kv"><tbody>'+info.map(kv=>'<tr><td class="k">'+kv[0]+'</td><td>'+kv[1]+'</td></tr>').join('')+'</tbody></table></div>';
}
// 단계 상태 뱃지 — 라이브러리 `.state-badge` 규격(결정 4003). 「건너뜀」이라는 말은 아직 열려 있음(D-4004)
const SWORD={ok:'성공', fail:'실패', skip:'건너뜀', run:'진행 중', idle:'대기'};
const SVAR ={ok:'is-active', fail:'is-fail', skip:'is-inactive', run:'is-run', idle:'is-draft'};
function badge(k){ return '<span class="state-badge '+SVAR[k]+'">'+SWORD[k]+'</span>'; }
// 무엇을 했나 — 마지막으로 끝난 단계가 한 일을 문장으로. 홈의 「마지막 실행」과 실행 하나 맨 위에 쓴다
// (사용자: "채널 공유한 건데 이런 문구로 했다 이런 식으로 해야 하는 거 아니야?")
function didLine(r){ const done=r.steps.filter(s=>s[2]==='ok'); if(!done.length) return '';
  const last=done[done.length-1];
  return '<div class="rc-what"><b>'+last[0]+'</b> · '+(last[1]||'')+'</div>'; }
// 결과 한 상자 — 머리(무엇을 했나) + 본문(그 문구)이 **한 덩이**다(2026-09-21 사용자:
//   "결과 아래에 박스 안에 채널 공유했다 하고 그 내용 적혀 있고가 한 개로 묶여 있는 게 낫지 않나?").
//   전에는 머리가 상자 밖에 떠 있어 둘이 따로 노는 것처럼 보였다
function 결과상자(r){ return '<div class="rc-doc">'+didLine(r)+'<div class="rc-body">'+r.result+'</div></div>'; }
// 홈의 「마지막 실행」·「지금 실행 중」 — 무엇을 했는지 한 줄, 그 다음 결과. 완료가 아니면 과정만
// 2026-09-19 — 「# 민원-검토 에서 보기」는 **홈 전용**이다(LAB 상세3기둥 P-1 한 곳에만 있던 줄).
//   전에는 이 함수를 실행 하나도 같이 쓰면서 inHome 을 안 봐서 저 줄이 실행 하나 요약에도 따라 나왔다
// 2026-09-20 · 결정 4004 — 「# 민원-검토 에서 보기」는 뺐다(사용자). 어디에 게시했는지는 바로 위 didLine 이
//   이미 말하고 있고(「채널 공유 — # 민원-검토 에 게시」), 시안에서 갈 곳도 없는 링크였다. 그래서 inHome 갈래도 사라졌다
function runBody(r){
  if(r.st==='ok') return 결과상자(r);
  return procHtml(r);
}
// 실행 하나 — 2026-09-19 부터 [요약 | 자세히] 를 나누지 않고 **한 장(자세히)** 으로 본다(사용자:
//   "요약, 자세히로 나누는 게 아니고 차라리 자세히로 하나 해놓고 표에서 좀 비주얼적인 표현을 가미").
//   완료면 맨 위에 무엇을 했나 + 결과, 그 아래 단계 표 · 세부 정보. 실행 중·실패도 같은 표를 쓴다
function renderRun(id){
  // 2026-09-20 — `runs()` 에서 찾는다. RUNS 만 뒤지면 **실패 상태에서만 붙는 FAILED(rf) 를 못 찾아**
  //   `?view=run:rf` 로 들어왔을 때 오른쪽이 빈 채로 남았다(설명서 대조에서 잡음)
  const r = id==='live' ? LIVE : (runs().find(x=>x.id===id) || RUNS.find(x=>x.id===id)); if(!r) return;
  // 제목 = 「언제 + 무엇」 — 시각이 앞에 온다(사용자: "26.09.12 09:00 완료 이런 식으로")
  const title = '<span class="t-when">'+r.start.slice(0,14)+'</span>'
    + (r.st==='ok' ? '<span class="t">완료</span>'
     // 2026-09-21 · 결정 4006 — 「3단계 근거 검색에서 멈춤」을 뺐다(사용자).
     //   바로 아래 「단계별 실행」 표가 **어느 단계가 실패인지 그 줄에서** 말해 준다.
     //   같은 말을 제목에서 한 번 더 하면 표를 안 읽게 된다. 「멈춘 곳」은 세부 정보에 남아 있다.
     : r.st==='fail' ? '<span class="t fail">실패</span>'
     : '<span class="t live">실행 중</span>');
  const act = r.st==='live'?'<span class="sp"></span><button class="b danger js-stop">중지</button>':'';
  const head = r.st==='ok' ? '<div class="lb lb-first">결과</div>'+결과상자(r) : '';
  $('.js-right').innerHTML='<div class="run-hd">'+title+act+'</div>'
    +'<div class="js-run-body">'+head+detHtml(r, !!head)+'</div>';
}
// 2026-09-20 — 상태·보기가 바뀌면 **주소에도 남긴다.** 전에는 끄기·지금 실행·이력 선택이 전부
//   JS 변수만 바꿔서, 주소는 그대로였다 → 새로고침하면 처음으로 돌아가고,
//   화면 설명서(`_설명서/`)의 왼쪽 목록도 따라오지 못했다
function 주소갱신(){
  // **`?state=…` 만 넘기면 안 된다** — 이 문서는 `<base href="../컴포넌트/">` 를 쓰므로
  //   replaceState 가 상대 주소를 base 기준으로 풀어 `/컴포넌트/?state=off` 가 되어 버린다(2026-09-20에 실제로 그랬다).
  //   그래서 지금 문서 경로를 붙여 절대 경로로 넘긴다. 404 와 같은 함정이다
  // `steps` 는 상태가 아니라 **데모 값**이라 render 마다 지워지면 안 된다 — 주소에 그대로 붙여 둔다(2026-09-21)
  const st = q.get('steps');

  try{ history.replaceState(null, '', 주소); }catch(e){}
}

const PDIR=location.pathname.replace(/[^/]*$/,'');

document.addEventListener('click', e=>{

  if(e.target.closest('.js-runnow')){ state='run'; view='run:live'; render(); return; }
  if(e.target.closest('.js-stop')){ state='wait'; view='home'; render(); return; }
  const d=e.target.closest('.demo button'); if(d){ state=d.dataset.s; view='home'; render(); return; }
});
render();
</script>
