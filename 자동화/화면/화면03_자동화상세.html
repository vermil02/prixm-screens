<style>
/* ── 화면③ 자동화 상세 — 2026-09-28 부터 **한 판**(결정 4007 · 4008 · 4009). 그 전은 3기둥(LAB 상세3기둥 P-1~P-5).
   조작 · 실행 이력 = 경로 줄 오른쪽. 「⟲ N」을 켜면 이력 화면 = 실행 하나 + 오른쪽 출처창 꼴 카드(결정 4012 · 그 전 왼쪽 기둥 4011).
   ⚠ 이 HTML 이 정본이다 — build_detail.py 로 다시 굽지 말 것(09-22 린트 반영과 이 변경이 사라진다) */
.body > .main{flex:1; min-width:0; display:flex; flex-direction:column;}   /* 화면①과 같은 값 — 없으면 본문이 내용 폭으로 줄어든다 */
/* 2026-09-19 — 왼쪽 단과 오른쪽이 **각자 스크롤**한다(사용자). 그래서 바깥은 안 굴리고(overflow:hidden)
   왼쪽은 실행 이력 목록만, 오른쪽은 본문이 굴러간다. 「‹ 전체 목록」·홈·바닥 「설정」은 늘 제자리 */
.content{display:block; min-height:0; overflow:hidden; flex:1;}
/* 2026-09-28 · 결정 4008 — **가운데 기둥을 없앴다**(LAB 상세이력자리 U-1b). 한 판이다.
   조작이 경로 줄로 나가자(결정 4007) 기둥에는 ‹ 전체 목록 · 이름 · 실행 이력만 남았고, 앞의 둘은 경로 줄과 타이틀이 이미 말한다.
   실행 이력은 타이틀 오른쪽 「실행 이력 N」이 부른다. 상태는 경로 줄 토글 · 본문 알림 띠 · LNB 점이 말한다(기둥의 홈 점이 하던 일) */
.p-page{height:100%; min-height:0; display:flex; flex-direction:column;}
@keyframes p-blink{from{opacity:1}to{opacity:.3}}
/* 이력 한 줄 — 펼치는 목록이 쓴다(옛 왼쪽 단 값 그대로) */
.pn-list{display:flex; flex-direction:column; gap:2px; min-height:0;}
.pn-row{display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:6px; font-size:12px; cursor:pointer; color:var(--color-n-800);}
.pn-row:hover{background:rgba(0,0,0,.05);} .pn-row.on{background:var(--color-lnb-selected,var(--color-lnb-selected));}
.pn-row .pr-d{font-variant-numeric:tabular-nums;}
.pn-row .pr-s{font-size:11px; color:var(--gray-500);} .pn-row .pr-s.fail{color:var(--color-danger);} .pn-row .pr-s.live{color:var(--color-success); font-weight:600;}
.pn-row.live .pr-d{color:var(--color-success); font-weight:600;}
.pn-empty{font-size:11px; color:var(--gray-400); padding:6px 8px;}

/* 스크롤 막대 5px 는 `_공용.css` 가 전 화면에 준다(다른 작업 · 2026-09-28) — 여기서 따로 쓰지 않는다 */
/* ── 경로 줄 조작 — 결정 4007(LAB 상세조작자리 T-4d) ──────────────────────────────
   [자동 실행 토글] [1회 실행] [설정] [검색]. 토글은 화면① 카드의 `.switch-demo`(32×18) 그대로, 글자 없이.
   아이콘은 옆 검색(`_상단바.js` ICO_SEARCH · 칸 26 · 16 · 선 1.5)과 같은 `.btn-ico`. 이름은 title 로 뜬다.
   ⚠ `_공용.css` 의 `.crumb .btn-ico{margin-left:auto}` 가 무리 안 아이콘마다 걸리므로 여기서 0 으로 되돌린다 */
.crumb .p-ctl{display:flex; align-items:center; gap:2px; margin-right:2px;}
.crumb .p-ctl .btn-ico{margin:0;}
.crumb .p-ctl .btn-ico.is-danger{color:var(--color-danger);}
.p-sw{display:inline-flex; align-items:center; height:26px; padding:0 4px; cursor:pointer;}
.p-sw:has(.is-disabled){cursor:default;}

/* ── 실행 이력 — 결정 4011 → 4012(LAB 상세출처창 S-1) ───────────────────────────────
   ① 부르개 = 경로 줄 무리 안 「⟲ N」(결정 4011) · 999 넘으면 999+. **켜고 끄는 버튼**이다 — 켜면 이력 화면, 다시 누르면 홈.
   ② 이력 화면 = 실행 하나 + 오른쪽에 뜬 **카드**. 카드 껍데기(폭 · 둥글기 · 그림자)는 AI 채팅 「출처」 창 그대로 `실측` · 글자와 줄 바탕은 결정 4017
      (저장본 `test-crew…ai-chat…_1920w_20260928-1150 (1).html` CSS 규칙 — .px-source-panel · __head · .px-source-item).
      자리 = 경로 줄 아래 20(top 106) · 오른쪽 24(라이브는 접기 레일이 있어 65).
   ③ 이력 화면은 **가운데 두 칸**(결정 4016) — [내용 960 | 목록 358] 묶음을 가운데. 그 전: 4013 덮기(768 · 4014) · 4012 비키기.
   ④ 이력 화면에서는 경로 줄의 토글 · 1회 실행을 걷는다(사용자) — crumbCtl() */
.crumb .p-hist{width:auto; padding:0 6px; gap:4px; font-size:12px; font-family:inherit; margin:0 2px 0 0; font-variant-numeric:tabular-nums;}
.crumb .p-hist.is-on{background:rgba(0,0,0,.05); color:var(--black-900);}
/* 경로 줄 3단 — 결정 4015. 화면②와 같은 값(화면02 375 · 378). 조각은 보여 주기만 한다(결정 180) — 돌아가기는 제목 앞 ‹ */

.crumb .js-crumb-mid{flex:0 0 auto;}
/* 접힌 레일(결정 4015)은 결정 4016 으로 걷었다 — 두 칸 짜임에서는 목록이 이력 화면의 한 칸이라 접을 일이 없다(사용자 「최소화 레일은 빼도 될듯」) */

   스크롤 막대는 오른쪽 끝에 그대로 두려고 칸을 좁히지 않고 안의 것만 묶는다. 사용자: "카드가 좀 멀어 보인달까" */

/* 2026-09-28 · 결정 4010(LAB 상세폭 Y-1) — **960 을 가운데에.** 기둥이 빠지자(결정 4008) 본문이 왼쪽에 붙은 채 1920 창에서 오른쪽 600 넘게 비었다.
   칸(.p-right)의 좌우 안쪽 여백을 「(폭 − 960) ÷ 2」로 준다 — 칸 자체는 창 끝까지라 **스크롤 막대는 오른끝에 남는다**. 좁은 창에서는 24 로 떨어진다.

.p-right{padding-left:max(24px, calc((100% - 960px) / 2)); padding-right:max(24px, calc((100% - 960px) / 2));}   /* 결정 4010 가운데 · 폭 960(결정 4016) */

.p-page.with-pan .p-right{padding-left:max(24px, calc((100vw - 308px - 1342px) / 2)); padding-right:calc(max(24px, calc((100vw - 308px - 1342px) / 2)) + 382px);}

/* 좁은 창(1280)에서 묶음이 안 들어가면 내용 칸이 540 으로 준다 — 표가 상자 폭에 맞춰 줄면 「결과」 칸이 0 이 되어 글자가 겹쳤다 `실측`.

   1500 = 308(GNB + LNB) + 24 + 표 최소 760 + 24 + 카드 358 + 24 — 표를 안 굴리고 두 칸이 다 들어가는 가장 좁은 폭.

.l-hd{display:flex; align-items:center; gap:8px; margin-bottom:14px;} .l-hd .t{font-size:15px; font-weight:600; color:var(--color-n-800);} .l-hd .n{font-size:13px; color:var(--gray-500); font-weight:400;}

.s5 > div{display:flex; gap:10px; align-items:baseline; min-width:0;} .s5 .rs-n{flex:0 0 120px;} .s5 > div .rs-d{margin-top:0; font-size:12px; color:var(--color-n-600);}
/* 머리 줄 — 「최근 실행 결과」 표의 th 와 같은 값(`.t-step th` · 바탕 Gray/100 · 11/600 #222 · 위아래 5 · 아래 선 --border-default).
   칸 자리는 아래 줄과 같다 `실측`: 번호 40 · 사이 8 · 단계명 120 · 사이 10 → 단계명 x 58 · 설정 x 188 */
.s5-hd{display:flex; gap:8px; align-items:center; padding:5px 9px; background:var(--color-primitive-gray-100,#f3f4f6);
  font-size:11px; font-weight:600; color:#222; border-bottom:1px solid var(--border-default);}
/* 번호 칸 40 · **왼쪽 맞춤** — 머리 「단계」 · 숫자 · 상태 원 모두 x 10 에서 시작하고, 남는 폭은 **단계명 앞**으로 간다.
   경위(2026-09-28 사용자): 28 · 왼쪽 → 「단계」와 「단계명」이 붙어 어색 → 40 · 가운데 → 「단계 왼쪽 여백 처음처럼 줄여주고
   단계하고 단계명 사이 여백만 늘려줘」. 그래서 왼쪽은 처음(10)대로, 사이만 넓다(원 18 뒤 22 = 40) */
.s5-hd span:first-child{flex:0 0 40px;} .s5-hd span:nth-child(2){flex:0 0 120px;} .s5-hd span:nth-child(3){margin-left:2px;}
.s5 .rs-i{margin:0 22px 0 0;}
/* 번호는 원을 뺀 **맨 숫자** — 표 안이라서(사용자 「번호는 원형 숫자에서 원형은 빼야하지않을까 표에 들어가는거면」).
   값은 「단계별 실행」 표의 번호 칸(`.tbl td.num` — 12px · --gray-400)과 같다. 칸 폭 18 은 그대로라 단계 · 설정 자리는 안 움직인다.
   **상태 표시는 원을 남긴다** — 실패 「!」(.fail) · 실행 중 도는 표시(.run) · 끝난 단계 체크(.ok)는 숫자가 아니라 상태다.
   `.rs-i` 는 「실행 하나」 단계 표시도 쓰므로 **「하는 일」(.s5) 안에만** 건다 */
.s5 .rs-i.num, .s5 .rs-i.idle, .s5 .rs-i.todo{border:0; background:none; border-radius:0; font-size:12px; color:var(--gray-400); font-variant-numeric:tabular-nums;
  justify-content:center;}   /* 숫자는 머리 「단계」 글자 폭(18 · x 10~28) 한가운데 — 상태 원(18)과 같은 가운데 19 (사용자 「단계 숫자는 단계 영역에서 가운데 정렬만」) */
.s5 .rs-i.todo{color:var(--gray-600);}
/* 줄 = 설정 창의 그 칸으로(2026-09-28) — 「최근 실행 결과」 줄과 같은 반응(호버 바탕 .05 · 키보드 파란 테두리) */
.s5.js-step{cursor:pointer;} .s5.js-step:hover{background:rgba(0,0,0,.05);} .s5.js-step:focus-visible{outline:2px solid var(--brand-primary); outline-offset:-2px;}   /* 설정 중 「아직 고르지 않음」 줄은 진한 번호였다 — 뜻을 지킨다 */
.s5 .rs-n{font-size:12px; font-weight:600;} .s5 .rs-d{font-size:11px; color:var(--gray-500); margin-top:2px; line-height:1.5; word-break:keep-all; overflow-wrap:anywhere;}   /* 결정 4014 — break-all 이 「처리 기준」을 「기/준」으로 끊었다. 한글은 낱말로, 긴 메일 주소만 아무 데서나 */ .s5.fail .rs-d{color:var(--color-danger);} .s5.todo .rs-d{color:var(--gray-400);}
.rs-i{flex:0 0 18px; width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; border:1px solid var(--border-default); color:var(--gray-500); background:#fff;}
.rs-i svg{width:11px; height:11px;} .rs-i.ok{background:var(--color-success-soft); border-color:var(--color-success); color:var(--color-success);} .rs-i.fail{background:var(--color-danger-soft); border-color:#ef4444; color:var(--color-danger); font-weight:700;} .rs-i.skip{color:var(--gray-400);} .rs-i.todo{background:var(--color-n-800); border-color:var(--color-n-800); color:#fff;} .rs-i.run{border-color:#22c55e;} .rs-i.idle{color:var(--gray-400);} .rs-i.num{color:var(--gray-500);}   /* num = 평소의 단계 번호(결정 4005) */
.spin{display:inline-block; width:10px; height:10px; border:1px solid #22c55e; border-top-color:transparent; border-radius:50%; animation:p-rot 1s linear infinite;}
@keyframes p-rot{to{transform:rotate(360deg)}}
/* 실행 하나 */
/* 실행 하나의 제목 줄 — 2026-09-20. 전에는 클래스 이름이 `.hd` 라 **공용 `.hd`(제품 상단 바)** 의
   `height:45px · padding:0 20px · border-bottom` 을 그대로 물려받아 제목만 왼쪽으로 20px 밀려 있었다(이름 충돌).
   `.run-hd` 로 가르고, 아래 가로줄도 없앴다(사용자). 제목은 「26.09.12 09:00 완료」처럼 시각이 앞에 온다 */
.run-hd{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.run-hd .t-when{font-size:15px; font-weight:600; color:var(--color-n-800); font-variant-numeric:tabular-nums;}
.run-hd .t{font-size:15px; font-weight:600;} .run-hd .t.fail{color:var(--color-danger);} .run-hd .t.live{color:var(--color-success);}
.dim{color:var(--gray-500); font-size:12px; font-weight:400;}
/* [요약 | 자세히] 세그먼트(.seg-row/.seg/.seg-b)는 2026-09-19 에 걷었습니다 — 실행 하나는 한 장뿐입니다 */
/* 무엇을 했나 한 줄 — 결과 상자 바로 위 */
/* 결과 상자 머리 — 상자 **안** 맨 위에 놓이고 옅은 선으로 본문과 갈린다(2026-09-21) */
.rc-what{font-size:12px; color:var(--gray-600); padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid var(--border-default);}
.rc-what b{font-weight:600; color:var(--color-n-800);}
.rc-body{font-size:13px; line-height:1.8;}
.lb{font-size:11px; font-weight:600; color:var(--gray-500); margin:14px 0 6px;} .lb-first{margin-top:4px;} .lb-gap{margin-top:26px;}
.tl{position:relative;} .tl-row{display:grid; grid-template-columns:18px minmax(0,1fr); gap:0 10px; padding:6px 0; position:relative;}
.tl-row:not(:last-child):before{content:""; position:absolute; left:9px; top:26px; bottom:-6px; width:1px; background:var(--border-default);}
.rs-n{font-size:12px; font-weight:600;} .tl-row.skip .rs-n,.tl-row.idle .rs-n{color:var(--gray-400); font-weight:500;} .rs-d{font-size:11px; color:var(--gray-500); line-height:1.5; margin-top:2px;} .tl-row.fail .rs-d{color:var(--color-danger);} .tl-act{margin-top:8px;}
/* 결과 본문 — 2026-09-20 결정 4004 로 **폭을 좌우로 채운다**(전에는 max-width:760). 본문 자체가 960 상한 안에 있다(사용자) */
.rc-doc{font-size:13px; line-height:1.8; background:var(--color-gnb-panel-bg); border:1px solid var(--border-subtle); border-radius:6px; padding:12px 14px;} .rc-doc.muted{color:var(--gray-500); text-align:center; font-size:12px;}
/* 홈 「최근 실행 결과」 표 — LAB 상세최근실행 R-3(2026-09-28). 「자세히」(.run-more · 결정 4004)는 줄 누르기가 대신해 걷었다.
   줄 전체가 누르는 자리 · 호버 바탕은 규칙표 값 하나(rgba(0,0,0,.05)) · 키보드 포커스는 파란 테두리 */
.t-recent tbody tr{cursor:pointer;}
.t-step.t-recent tbody tr:hover td{background:rgba(0,0,0,.05);}
.t-step.t-recent tbody tr:focus-visible{outline:2px solid var(--brand-primary); outline-offset:-2px;}
.t-recent td.res{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.t-recent tr.fail td.res{color:var(--color-danger);}
/* ★ 표 테두리(사용자 「표 테두리 잘 챙겨주고」) — 랩 그대로면 두 곳이 샜다 `실측`
   ① 상자가 둥근데(8) `overflow:visible` 이라 회색 머리 칸 · 흰 칸의 **네모 모서리가 둥근 선을 덮었다** → 상자에서 자른다
   ② 상자 위 테두리 1px 바로 안에 머리 칸 위 테두리 1px 이 또 있어 **위 선만 2px** → 머리 칸 위 선을 뺀다(상자 선이 맡는다) */
.box:has(.t-recent){overflow:hidden;}
.t-step.t-recent th{border-top:0;}
.sec-hd .r-all{margin-left:auto; font-size:12px; color:var(--gray-600); padding:3px 8px;}   /* LAB 전체보기 W2-1 — 안쪽 좌우 3 → 8. **버튼 칸의 오른끝**을 아래 표 오른끝에 맞춘다(사용자 「버튼 기준 우측 라인이 하단 콘텐츠와 우측 정렬」 · 글자는 8 안쪽) */ .sec-hd .r-all:hover{color:var(--black-900);}
/* .rc-link(「# 민원-검토 에서 보기」)는 결정 4004 로 없앴습니다 */
.box{border:1px solid var(--border-default); border-radius:8px; padding:4px 10px 6px; background:#fff;}
.tbl{width:100%; border-collapse:collapse; font-size:12px;} .tbl th{font-size:11px; color:var(--gray-500); font-weight:600; text-align:left; padding:6px 8px 2px;} .tbl td{padding:9px 8px; border-bottom:1px solid var(--border-subtle); vertical-align:top;} .box tr:last-child td{border-bottom:0;}
.tbl td.num{color:var(--gray-400); width:20px;} .tbl td.nm{font-weight:600; white-space:nowrap;} .tbl td.ts{white-space:nowrap; color:var(--gray-600); font-variant-numeric:tabular-nums;} .tbl td.res{width:46%;}
.tbl tr.fail td.nm,.tbl tr.fail td.res,.tbl tr.fail td.ts{color:var(--color-danger);} .tbl tr.skip td,.tbl tr.idle td{color:var(--gray-400);} .tbl tr.fail .lnk{color:var(--brand-primary); margin-left:4px;}
/* (안 씀 — 세부 정보가 2026-09-28 에 `.t-step.t-kv` 표로 옮겼다) */ .tbl-kv{max-width:760px;} .tbl-kv td.k{color:var(--gray-500); width:110px; white-space:nowrap;}

/* ── 「단계별 실행」 표 — LAB 실행표 E-2 채택(결정 4003 · 2026-09-19) ──────────────────
   표 규격은 컴포넌트 34-tbl `.tbl-table` 실측값 그대로(머리글 Gray/100 · 11/600 · 5px 10px ·
   칸은 border-top 만). 세부 정보 표(.tbl-kv)는 건드리지 않으려고 .t-step 으로 가둔다 */
.boxcap{max-width:960px; margin-right:auto;}   /* 결정 4016 — 본문 상한과 같게 960 */   /* "좌우로 너무 넓다" — 2026-09-17 LAB R-2 와 같은 값 */
.t-step{table-layout:fixed;}
.t-step th{background:var(--color-primitive-gray-100,#f3f4f6); color:#222; font-size:11px; font-weight:600;
  padding:5px 10px; border-top:0; border-bottom:1px solid var(--border-default);}   /* 위 선은 상자가 맡는다 — 앞서 머리 칸 1px 이 상자 1px 안에 또 있어 위만 2px 이었다(2026-09-28 `실측`) */
.t-step td{background:#fff; padding:11px 9px; border-top:1px solid var(--border-default); border-bottom:0;
  vertical-align:middle;}                       /* 세로 가운데 — 결과가 두 줄이어도 단계·상태가 가운데에 선다 */
.t-step tbody tr:first-child td{border-top:0;}
/* 줄 높이 **최소 44 공통**(2026-09-28 사용자 「세부 정보, 표 위아래 높이도 공통으로 맞춰야」) — 배지(22)가 있는 표는 44, 없는 세부 정보는 37 이었다 `실측`.
   표 줄의 height 는 최소값으로 굴어 두 줄 글은 그대로 늘어난다. 「하는 일」(.s5 min-height 44)과 같은 값 */
.t-step tbody tr{height:44px;}
.t-step th:nth-child(3), .t-step td.stt{padding-right:20px;}   /* 상태 ↔ 결과 사이를 벌린다 */
.t-step td.res{width:auto; white-space:normal; word-break:keep-all;}
.t-step td.nm{white-space:normal;}
.t-step tr.fail td{background:#fff;}            /* 실패 줄에 배경은 깔지 않는다 — 글자 색만(사용자) */
.box:has(.t-step){padding:0; overflow:hidden;}   /* 둥근 모서리(8)를 머리 칸 · 흰 칸이 덮지 않게 자른다(2026-09-28 · 최근 실행 결과 표와 같은 처리) */
.t-step th.num, .t-step td.num{text-align:center;}   /* 「순서」와 숫자를 한 가운데 줄로 — 「하는 일」과 같은 결 */
.t-kv td.k{color:var(--color-n-600); white-space:nowrap;}   /* 세부 정보 항목 칸 — 「하는 일」의 설정 · 표의 시작 칸과 같은 회색 */
.none{color:var(--gray-400);}

/* 상태 뱃지 — 라이브러리 `.state-badge` 규격(11/500 · 3px 8px · radius 5).
   is-active(성공)·is-inactive(건너뜀)·is-draft(대기)는 라이브러리 값 그대로.
   **is-fail·is-run 은 라이브러리에 없어 여기서 만든 변형입니다 — 디자인 단계에서 컴포넌트로 올릴 것**
   (as-is 에서는 `컴포넌트/` 를 고치지 않는다 · 작업 규칙 5.2). 라이브러리 주석대로 색만이 아니라
   채움/테두리로도 갈리게 두어 색각 이상에서도 구분됩니다 */
.state-badge{font-size:11px; font-weight:500; letter-spacing:-0.5px; padding:3px 8px; border-radius:3px;
  border:1px solid transparent; display:inline-block; white-space:nowrap;}
.state-badge.is-active{background:var(--color-success-soft); color:#15803d;}
.state-badge.is-inactive{background:var(--color-primitive-gray-100,#f3f4f6); color:var(--gray-600);}
.state-badge.is-draft{background:transparent; color:var(--gray-600); border-color:var(--border-default);}
.state-badge.is-fail{background:var(--color-danger-soft); color:var(--color-danger);}
.state-badge.is-run{background:var(--color-success-soft); color:#15803d; border-color:transparent; display:inline-flex; align-items:center; gap:4px;}   /* LAB 진행중태그 R2-1(2026-09-29) — 「성공」과 같은 옅은 초록 채움 + 도넛. 전에는 투명 + 회색 테두리라 버튼처럼 보였다 */
/* 도넛 = 화면① 카드 노드의 `.n .donut`(화면01:184~186) 과 같은 움직임(sp-rot · sp-dash 1.4s · _공용.css) — 10px · 바탕 원 없음(사용자 「도넛 배경은 흰색 빼는 건?」) */
.state-badge .b-dn{width:10px; height:10px; flex:0 0 auto; animation:sp-rot 1.4s linear infinite; transform-origin:center;}
.state-badge .b-dn circle{fill:none; stroke:var(--color-success); stroke-width:3.4; stroke-linecap:round; stroke-dasharray:50.27; stroke-dashoffset:50.27; transform-origin:center; animation:sp-dash 1.4s ease-in-out infinite;}
/* 설정 중 — 「설정 이어서 하기」 덩이를 **남은 자리의 세로 가운데**로(2026-09-28 사용자 「설정 이어서 하기 섹션이 화면 세로로 중앙에」).
   앞서 스크롤 칸이 내용 높이(86~421)에서 멈춰 덩이가 위에 붙었다 `실측`. 이 상태에서만 칸을 창 끝까지 늘리고 덩이를 margin auto 로 가운데.
   다른 상태 짜임은 안 건드리려고 「덩이가 칸의 바로 아래 자식일 때」(:has)에만 건다 */
.p-right:has(> .st-empty){flex:1; display:flex; flex-direction:column;}   /* 바깥 .p-page 가 세로 짜임이라 늘리는 것은 flex:1(align-self 로는 안 늘었다 `실측`) */
.p-right > .st-empty{flex:1; margin:18px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
/* ↑ 같은 날 — 점선 상자를 **남은 자리 위아래로 꽉**(사용자 「그 점선 사각형도 위아래로 늘려줘 · 상단 섹션 아래 가로선에 딱 붙지는 않게」).
     위 18 = 다른 상태에서 요약 카드가 제목 줄 가로선과 띄우는 값(.sum margin-top) · 아래는 칸 안쪽 여백 24 · 글과 버튼은 상자 한가운데 */
.st-empty{border:1px dashed var(--border-default); border-radius:8px; padding:56px 28px;   /* 위아래 28 → 56(2026-09-28 사용자 「설정 이어서 하기 섹션 위아래 늘리고」) */ text-align:center; margin:18px 0 22px;}   /* 위 18 — .sum 과 같은 값(설정 중 상태에서 설명 줄 다음에 오는 것) */ .em-t{font-size:14px; font-weight:600; margin-bottom:14px;}   /* 6 → 14 — 설명 줄(.em-d)을 뺐더니 버튼이 제목에 6 으로 붙었다. 앞서 버튼 앞 간격이던 14 를 그대로(2026-09-28) */ .em-d{font-size:12px; color:var(--gray-600); margin-bottom:14px; line-height:1.6;}
/* 알림 띠 — 실패든 직접 끔이든 **회색 한 가지**다(2026-09-20 사용자). 노란 경고는 쓰지 않는다 */
/* 꺼짐 띠 — 말 **바로 뒤**에 버튼(2026-09-28 사용자 「바로 우측에 약간의 여백 주고」 — 처음엔 오른쪽 끝이었다).
   버튼 28 이 들어가도록 위아래를 줄여 띠 높이(44)를 지킨다 */
.warn.off{display:flex; align-items:center; gap:10px; padding:7px 8px 7px 14px;}

    if(state==='fail' && i===2){ k='fail'; v=s[1]+' · 접근 불가'; }
    if(state==='setup' && (i===0||i===3)){ k='todo'; v='아직 고르지 않음'; }
    if(state==='run'){ k = i<2?'ok': i===2?'run':'idle'; }
    let ico, cls=k;
    if(k==='ok'){ if(state==='run'){ ico=CHK; } else { ico=String(i+1); cls='num'; } }   // 체크는 실행 중에만

    // 설명 줄(「수신 이메일 계정과 AI 직원을 아직 안 골랐습니다 …」)은 뺐다 — 자동화마다 비는 칸이 달라 계속 바뀌는 말이고, 설정 창을 열면 빈 칸이 보인다(2026-09-28 사용자 「굳이??」)
    h+='<div class="st-empty"><div class="em-t">자동화 설정이 완료되지 않았습니다.</div><button class="b primary js-settings">설정 이어서 하기</button></div>';
    // 2026-09-28 사용자 「여기서 하는 일 그냥 빼도 될 듯」 — 설정 중에는 하는 일 칸을 두지 않는다(아직 고르지 않은 칸은 설정 화면이 보여 준다)
    $('.js-right').innerHTML=h; return;
  }
  // 요약 카드 셋 = **누적 실행 · 실패 · 마지막 실행**(2026-09-28 사용자 「누적 실행, 실패, 마지막 실행 이걸로 … 실패 누르면 실행 결과에서 실패 내역만」).
  //   「최근 30일 41회 · 실패 2」를 걷었다 — 보고 나서 할 일이 없는 숫자였다. 숫자는 이력 데이터에서 센다(앞서 128 은 손으로 적어 실행 중에 이력 창 129 와 어긋났다)
  //   누적 → 이력 창 「전체」(= 전체 보기 · js-hist) · 실패 → 이력 창 「실패」 + 가장 최근 실패(js-sum-fail) · 0 이면 「없음」이고 안 눌린다
  //   이름은 「누적 실패」(사용자) — 옆 「누적 실행」과 기간이 같다는 것을 이름이 말한다
  const 실패들=runs().filter(r=>r.st==='fail');
  h+='<div class="sum"><div class="sum-i sum-go js-hist" tabindex="0" role="button"><div class="sum-k">누적 실행</div><div class="sum-v">'+runs().length+'<small>회</small></div></div>'
    +(실패들.length ? '<div class="sum-i sum-go js-sum-fail" tabindex="0" role="button"><div class="sum-k">누적 실패</div><div class="sum-v fail-n">'+실패들.length+'<small>회</small></div></div>'
                    : '<div class="sum-i"><div class="sum-k">누적 실패</div><div class="sum-v none-v">없음</div></div>')
    // 「마지막 실행」 카드 = 그 실행으로 간다(2026-09-28 사용자 「마지막 실행 카드 안에 누르면 해당 이력으로 이동」). 실행 중이면 지금 도는 실행
    +'<div class="sum-i sum-go js-nav" data-v="run:'+(state==='run'?'live':lr.id)+'" tabindex="0" role="button"><div class="sum-k">'+(state==='run'?'지금':'마지막 실행')+'</div><div class="sum-v '+(state==='run'?'ok':lr.st==='ok'?'ok':'bad')+'">'+(state==='run'?'실행 중 · 14:32 시작':lr.date+' '+lr.start.slice(9,14)+' · '+(lr.st==='ok'?'완료':'실패'))+'</div></div></div>';
  // 2026-09-20 · 결정 4004 — 머리의 「설정 고치기」는 뺐다. 설정은 왼쪽 단 바닥 버튼 하나로 간다(사용자)
  // 머리 줄(2026-09-28 사용자 「그 표처럼 항목 줄 넣고」 → 「단계, 단계명?, 설정」 → 「순서, 작업, 설정」) — 번호 칸도 이름을 단다.
  //   ※ 「단계별 실행」 표는 같은 칸을 「단계」라 부른다 — 두 표 이름이 다르다(사용자가 고른 것)
  h+='<div class="sec-hd"><span class="sec-t">하는 일</span></div><div class="steps5"><div class="s5-hd" aria-hidden="true"><span>순서</span><span>작업</span><span>설정</span></div>'+stepMarks()+'</div>';
  // 「자세히」는 머리 오른쪽이 아니라 **결과 아래 맨 끝**에 둔다(사용자). 「# 민원-검토 에서 보기」는 뺐다
  // 2026-09-20 · 결정 4005(LAB 하는일 **L-1 채택**) — 사용자: "그럼 J-4가 있는데 뭐 하러
  //   「하는 일 · 설정」하고 「지금 실행 중」이 나와?" 맞는 말이라, **과정뿐인 것은 여기 두지 않는다.**
  //   결과가 있는 실행(완료)만 본문을 펴고, 과정뿐인 것(실행 중 · 실패)은 위 하는 일 칸이 이미 말하므로
  //   「자세히」 버튼으로만 넘긴다 — 같은 다섯 단계를 두 번 그리지 않는다
  // ★ 2026-09-28 · LAB 상세최근실행 **R-3 채택**(결정 번호 미정 — 화면③ 흐름에 맞춰 매길 것) — 「마지막 실행」 결과 한 통 + 「자세히」 → **최근 실행 결과 표**.
  //   사용자: "최근 실행내역을 테이블 형태로 보여주고 테이블 항목을 누르거나 … 전체보기 누르면 실행 내역 창을 연다던지"
  //           · "시작, 소요, 상태, 결과 이런순으로" · "「최근 실행 결과」라고 하는게" · "전체 보기 뒤에 숫자는 빼도될듯"
  //   ① 최근 5건 · 줄 = 그 실행(`js-nav` · 이력 카드와 같은 길) · Enter 로도 연다
  //   ② 「전체 보기」 = 경로 줄 「⟲ N」과 같은 일(`js-hist`) — 넓으면 가장 최근 실행 + 카드 · 좁으면 목록(결정 4018). 숫자는 ⟲ 가 말한다
  //   ③ 표 규격은 「단계별 실행」(`.t-step` · 결정 4003). 결과가 맨 끝이라 남는 폭을 다 쓴다. 「자세히」(결정 4004)는 줄 누르기가 대신한다
  const 상태=r=>r.st==='live'?'run':r.st, 소요=r=>typeof r.dur==='number'?r.dur+'초':(r.dur||'–');
  const 줄들=runs().slice(0,5).map(r=>'<tr class="js-nav '+상태(r)+'" data-v="run:'+r.id+'" tabindex="0">'
    +'<td class="ts">'+r.date+' '+r.start.slice(9,14)+'</td><td class="ts">'+소요(r)+'</td>'
    +'<td class="stt">'+badge(상태(r))+'</td><td class="res">'+한일(r)+'</td></tr>').join('');
  h+='<div class="sec-hd"><span class="sec-t">최근 실행 결과</span><button class="px-btn-text r-all js-hist">전체 보기</button></div>'
    +'<div class="box boxcap"><table class="tbl t-step t-recent"><colgroup><col style="width:120px"><col style="width:66px"><col style="width:76px"><col></colgroup>'
    +'<thead><tr><th>시작</th><th>소요</th><th>상태</th><th>결과</th></tr></thead><tbody>'+줄들+'</tbody></table></div>';
  $('.js-right').innerHTML=h;
}

// ── 오른쪽 — 실행 하나 (요약 ↔ 자세히 · LAB R-2g) ───────────────────────
function ico(k){ return {ok:'<span class="rs-i ok">'+CHK+'</span>', fail:'<span class="rs-i fail">!</span>', skip:'<span class="rs-i skip">–</span>', run:'<span class="rs-i run">'+SPIN+'</span>', idle:'<span class="rs-i idle"></span>'}[k]; }
function procHtml(r){   // 과정 — 단계 이름 · 내용. 시간은 자세히에서
  return '<div class="tl">'+r.steps.map(s=>'<div class="tl-row '+s[2]+'">'+ico(s[2])+'<div><div class="rs-n">'+s[0]+'</div>'+(s[1]?'<div class="rs-d">'+s[1]+'</div>':'')+(s[2]==='fail'?'<div class="tl-act"><button class="b js-settings">설정 열기</button></div>':'')+'</div></div>').join('')+'</div>';
}
// 2026-09-28 — 머리 줄을 「하는 일」과 같은 말로: (빈칸) · 단계 → **순서 · 작업**(사용자 「단계별 실행에도 순서, 작업 이런 식으로 표 항목명하고 개선」).
//   번호 칸 28 → 44 · 「순서」와 숫자를 가운데로
function detHtml(r, notFirst){    // 단계별 실행 표(단계 · 결과 · 소요 · 시작 · 종료) + 세부 정보 표. 날짜는 시작·종료 칸에 늘
  const d=r.date;
  // 표의 시각 표현(상태 표 · 소요 막대 …)은 **정본에 바로 넣지 않습니다** — `_lab/실행표_lab.html` 에서 견주는 중입니다(2026-09-19).
  // 여기는 LAB R-2g 로 정해진 맨 표 그대로 둡니다
  // 2026-09-19 · 결정 4003 — LAB `_lab/실행표_lab.html` **E-2 채택**(사용자 "e-2 나쁘지 않은 듯").
  //   ① 「상태」 열을 따로 두고 성공/실패/건너뜀/진행 중/대기를 `.state-badge` 로 말한다(결과 칸은 내용만)
  //   ② 표는 컴포넌트 34-tbl `.tbl-table` 규격(머리글 Gray/100 · 칸은 border-top 만)
  //   ③ 세로 가운데 · 상태 칸 오른쪽 20px · 열 폭 colgroup 고정 · 표 폭 상한 960(2026-09-17 R-2 와 같은 값)
  //   ④ 실패 줄에 배경은 깔지 않는다 — 글자 색만(사용자)
  const rows=r.steps.map((s,i)=>{
    const k=s[2], body=(s[1]||'') || (k==='skip'?'<span class="none">실행되지 않음</span>':k==='idle'?'<span class="none">–</span>':'');
    return '<tr class="'+k+'"><td class="num">'+(i+1)+'</td><td class="nm">'+s[0]+'</td>'
      +'<td class="stt">'+badge(k)+'</td>'
      +'<td class="res">'+body+(k==='fail'?' <span class="lnk js-settings">설정 열기</span>':'')+'</td>'
      +'<td class="ts">'+(s[5]||'–')+'</td><td class="ts">'+(s[3]?d+' '+s[3]:'–')+'</td><td class="ts">'+(s[4]?d+' '+s[4]:'–')+'</td></tr>';
  }).join('');
  const CG='<colgroup><col style="width:44px"><col style="width:132px"><col style="width:76px"><col><col style="width:66px"><col style="width:150px"><col style="width:150px"></colgroup>';
  const info=[['왜 실행됐나',r.why],['실행 방식','자동 (이메일 수신이 시작함)'],['실행한 시간',r.start],['종료한 시간',r.end||'–'],['소요',typeof r.dur==='number'?r.dur+'초':(r.dur||'–')],['실행 ID','run_'+r.id]].concat(r.stop?[['멈춘 곳',r.stop]]:[]);
  return '<div class="lb '+(notFirst?'lb-gap':'lb-first')+'">단계별 실행</div><div class="box boxcap"><table class="tbl t-step">'+CG+'<thead><tr><th class="num">순서</th><th>작업</th><th>상태</th><th>결과</th><th>소요</th><th>시작</th><th>종료</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
       // 세부 정보도 **같은 표**(2026-09-28 사용자 「세부 정보도 이전처럼 표형태로」) — 앞서 `.tbl-kv` 는 머리 줄이 없고 줄 선이 760 에서 끊겼다 `실측`
       +'<div class="lb lb-gap">세부 정보</div><div class="box boxcap"><table class="tbl t-step t-kv"><colgroup><col style="width:140px"><col></colgroup>'
       +'<thead><tr><th>항목</th><th>내용</th></tr></thead><tbody>'+info.map(kv=>'<tr><td class="k">'+kv[0]+'</td><td>'+kv[1]+'</td></tr>').join('')+'</tbody></table></div>';
}
// 단계 상태 뱃지 — 라이브러리 `.state-badge` 규격(결정 4003). 「건너뜀」이라는 말은 아직 열려 있음(D-4004)
const SWORD={ok:'성공', fail:'실패', skip:'건너뜀', run:'진행 중', idle:'대기'};
const SVAR ={ok:'is-active', fail:'is-fail', skip:'is-inactive', run:'is-run', idle:'is-draft'};
const B_DN='<svg class="b-dn" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/></svg>';   // 진행 중 도넛(바탕 원 없이 호만)
function badge(k){ return '<span class="state-badge '+SVAR[k]+'">'+(k==='run'?B_DN:'')+SWORD[k]+'</span>'; }
// 무엇을 했나 — 마지막으로 끝난 단계가 한 일을 문장으로. 홈의 「마지막 실행」과 실행 하나 맨 위에 쓴다
// (사용자: "채널 공유한 건데 이런 문구로 했다 이런 식으로 해야 하는 거 아니야?")
function didLine(r){ const done=r.steps.filter(s=>s[2]==='ok'); if(!done.length) return '';
  const last=done[done.length-1];
  return '<div class="rc-what"><b>'+last[0]+'</b> · '+(last[1]||'')+'</div>'; }
// 결과 한 상자 — 머리(무엇을 했나) + 본문(그 문구)이 **한 덩이**다(2026-09-21 사용자:
//   "결과 아래에 박스 안에 채널 공유했다 하고 그 내용 적혀 있고가 한 개로 묶여 있는 게 낫지 않나?").
//   전에는 머리가 상자 밖에 떠 있어 둘이 따로 노는 것처럼 보였다
function 결과상자(r){ return '<div class="rc-doc">'+didLine(r)+'<div class="rc-body">'+r.result+'</div></div>'; }
// 홈의 「마지막 실행」·「지금 실행 중」 — 무엇을 했는지 한 줄, 그 다음 결과. 완료가 아니면 과정만
// 2026-09-19 — 「# 민원-검토 에서 보기」는 **홈 전용**이다(LAB 상세3기둥 P-1 한 곳에만 있던 줄).
//   전에는 이 함수를 실행 하나도 같이 쓰면서 inHome 을 안 봐서 저 줄이 실행 하나 요약에도 따라 나왔다
// 2026-09-20 · 결정 4004 — 「# 민원-검토 에서 보기」는 뺐다(사용자). 어디에 게시했는지는 바로 위 didLine 이
//   이미 말하고 있고(「채널 공유 — # 민원-검토 에 게시」), 시안에서 갈 곳도 없는 링크였다. 그래서 inHome 갈래도 사라졌다
function runBody(r){
  if(r.st==='ok') return 결과상자(r);
  return procHtml(r);
}
// 실행 하나 — 2026-09-19 부터 [요약 | 자세히] 를 나누지 않고 **한 장(자세히)** 으로 본다(사용자:
//   "요약, 자세히로 나누는 게 아니고 차라리 자세히로 하나 해놓고 표에서 좀 비주얼적인 표현을 가미").
//   완료면 맨 위에 무엇을 했나 + 결과, 그 아래 단계 표 · 세부 정보. 실행 중·실패도 같은 표를 쓴다
function renderRun(id){
  // 2026-09-20 — `runs()` 에서 찾는다. RUNS 만 뒤지면 **실패 상태에서만 붙는 FAILED(rf) 를 못 찾아**
  //   `?view=run:rf` 로 들어왔을 때 오른쪽이 빈 채로 남았다(설명서 대조에서 잡음)
  const r = id==='live' ? LIVE : (runs().find(x=>x.id===id) || RUNS.find(x=>x.id===id)); if(!r) return;
  // 제목 = 「언제 + 무엇」 — 시각이 앞에 온다(사용자: "26.09.12 09:00 완료 이런 식으로")
  // 결정 4015 — 제목 앞 ‹ = 홈(이전으로). 사용자: "타이틀 쪽에도 이전으로 돌아가기 버튼 같은 게 있어야 할 듯"
  // 제목 앞 ‹ 는 결정 6008 로 걷었다 — 경로 줄 맨 앞 ‹ 가 맡는다(좁은 창에서는 목록으로 · 결정 4018)
  const title = '<span class="t-when">'+r.start.slice(0,14)+'</span>'
    + (r.st==='ok' ? '<span class="t">완료</span>'
     // 2026-09-21 · 결정 4006 — 「3단계 근거 검색에서 멈춤」을 뺐다(사용자).
     //   바로 아래 「단계별 실행」 표가 **어느 단계가 실패인지 그 줄에서** 말해 준다.
     //   같은 말을 제목에서 한 번 더 하면 표를 안 읽게 된다. 「멈춘 곳」은 세부 정보에 남아 있다.
     : r.st==='fail' ? '<span class="t fail">실패</span>'
     : '<span class="t live">실행 중</span>');
  // 중지는 경로 줄(결정 4007)과 여기 둘이다. 머리의 「실행 이력」은 결정 4011 로 걷었다 — 기둥이 늘 보인다
  const act = r.st==='live'?'<span class="sp"></span><button class="b danger js-stop">중지</button>':'';
  const head = r.st==='ok' ? '<div class="lb lb-first">결과</div>'+결과상자(r) : '';
  $('.js-right').innerHTML='<div class="run-hd">'+title+act+'</div>'   // 홈으로는 기둥 맨 위 「‹ 이름」(결정 4011)
    +'<div class="js-run-body">'+head+detHtml(r, !!head)+'</div>';
}
// 2026-09-20 — 상태·보기가 바뀌면 **주소에도 남긴다.** 전에는 끄기·지금 실행·이력 선택이 전부
//   JS 변수만 바꿔서, 주소는 그대로였다 → 새로고침하면 처음으로 돌아가고,
//   화면 설명서(`_설명서/`)의 왼쪽 목록도 따라오지 못했다
function 주소갱신(){
  // **`?state=…` 만 넘기면 안 된다** — 이 문서는 `<base href="../컴포넌트/">` 를 쓰므로
  //   replaceState 가 상대 주소를 base 기준으로 풀어 `/컴포넌트/?state=off` 가 되어 버린다(2026-09-20에 실제로 그랬다).
  //   그래서 지금 문서 경로를 붙여 절대 경로로 넘긴다. 404 와 같은 함정이다
  // `steps` 는 상태가 아니라 **데모 값**이라 render 마다 지워지면 안 된다 — 주소에 그대로 붙여 둔다(2026-09-21)
  const st = q.get('steps');
  const 주소 = location.pathname + '?state=' + state + (view==='home' ? '' : '&view='+view) + (st ? '&steps='+st : '');
  try{ history.replaceState(null, '', 주소); }catch(e){}
}
// 2026-09-21 — 시안 상태 버튼(오른쪽 아래)은 **단독으로 열었을 때만** 보인다.
//   화면 설명서 안(iframe)에서는 왼쪽 목록이 이미 같은 상태들을 줄로 갖고 있어 같은 것이 두 번이다(사용자).
(function(){ try{ if(window.self!==window.top){ const d=document.querySelector('.js-demo'); if(d) d.hidden=true; } }catch(e){} })();
function render(){ renderNav(); if(view==='home') renderHome(); else if(view==='list') renderList(); else renderRun(view.slice(4)); $$('.demo button').forEach(b=>b.classList.toggle('on', b.dataset.s===state)); 주소갱신(); }

// ── 화면 이동 ─────────────────────────────────────────────────────────────
// 이 문서들은 <base href="../컴포넌트/"> 를 써서 상대 주소가 컴포넌트 폴더로 간다 → 그냥 두면 404.
// 화면①·②와 같은 방식으로, 지금 문서가 있는 폴더를 붙여 절대 경로로 만든다(2026-09-19).
const PDIR=location.pathname.replace(/[^/]*$/,'');
function goPage(f,q){ location.href=PDIR+encodeURIComponent(f)+(q||''); }

// ── 토글 확인창 — 화면①과 같다(결정 4007) ─────────────────────────────────
//   ① 실행 중에 끌 때 — 자동 실행을 끄면 지금 도는 것도 멈추기 때문(「중지」는 확인 없이 이번 실행만)
//   ② 실패로 꺼진 것을 켤 때 — 원인이 그대로면 다음 실행도 실패할 수 있다
const cf1=document.createElement('div'); cf1.className='cf-wrap'; cf1.hidden=true;
cf1.innerHTML='<div class="cf-box" role="dialog" aria-modal="true"><div class="cf-t">자동 실행을 끌까요?</div><div class="cf-d">지금 진행 중인 자동화가 도중에 중지됩니다.</div><div class="cf-a"><button class="run-btn js-cf1-no">취소</button><button class="run-btn cf-danger js-cf1-yes">끄기</button></div></div>';
const cf2=document.createElement('div'); cf2.className='cf-wrap'; cf2.hidden=true;
cf2.innerHTML='<div class="cf-box" role="dialog" aria-modal="true"><div class="cf-t">다시 켤까요?</div><div class="cf-d js-cf2-d"></div><div class="cf-a"><button class="run-btn js-cf2-no">취소</button><button class="run-btn js-cf2-yes">켜기</button></div></div>';
document.body.appendChild(cf1); document.body.appendChild(cf2);

// ── 조작 ──────────────────────────────────────────────────────────────────
// 홈 「최근 실행 결과」 줄 · 「마지막 실행」 카드는 <tr>·<div> 라 스스로 안 눌린다 — 포커스가 있을 때 Enter 로 연다
document.addEventListener('keydown', e=>{ const tr=e.target.closest&&e.target.closest('.t-recent tr.js-nav, .sum-go, .js-h-f, .js-step'); if(tr && e.key==='Enter') tr.click(); });
document.addEventListener('click', e=>{
  const nav=e.target.closest('.js-nav'); if(nav){ if(view==='list') 목록스크롤=$('.js-right').scrollTop; if(nav.dataset.v==='home'){ 보임L=한번; 목록스크롤=0; } view=nav.dataset.v; render(); return; }
  const sp=e.target.closest('.js-step'); if(sp){ goPage('화면02_자동화생성.html','?tpl=drone&edit=1'+(sp.dataset.f?'&field='+sp.dataset.f:'')); return; }
  if(e.target.closest('.js-settings')){ goPage('화면02_자동화생성.html','?tpl=drone&edit=1'); return; }   // 설정 = 작성 화면이 이 자동화 값으로 열린다(P-5)
  if(e.target.closest('.js-crumb-list')||e.target.closest('.js-all-menu')){ goPage('화면01_전체목록.html'); return; }   // 기둥의 ‹ 전체 목록(js-back)은 결정 4008 로 걷었다 — 경로 줄 「전체 목록」이 같은 일
  // LNB — 「새 자동화」는 화면②로. 「전체 목록」(.js-all-menu)은 바로 위에서 맡는다
  const ch=e.target.closest('.channel-text-demo');
  if(ch && ((ch.querySelector('.ch-label')||{}).textContent||'').trim()==='새 자동화'){ goPage('화면02_자동화생성.html'); return; }
  // 실행 이력(결정 4011) — 부르개는 **바로** 가장 최근 실행을 기둥과 함께 연다 · 「더 보기」는 30개 더
  // 결정 4012 — 「⟲ N」은 켜고 끈다: 켜면 가장 최근 실행 + 카드, 이미 켜져 있으면 홈으로. 카드 ✕ 도 끄기
  // 「⟲」: 이력 화면이면 나가기(홈) · 홈이면 가장 최근 실행 + 목록(결정 4015 · 4016)
  // 결정 4018 — 홈에서 「⟲」: 넓으면 가장 최근 실행 + 카드 · 좁으면 목록 화면. 이력 화면에서는 나가기(홈)
  if(e.target.closest('.js-hist')){ if(view!=='home'){ view='home'; render(); return; } if(좁음()){ 목록스크롤=0; view='list'; render(); return; } const r=runs()[0]; if(r){ view='run:'+r.id; render(); } return; }
  // 경로 줄 ‹ — 결정 6008. 홈 → 전체 목록 · 목록 화면 → 홈 · 실행 하나 → 좁은 창이면 목록, 넓으면 홈
  // 경로 줄 조각(링크 표시가 붙은 것만) — 이름 = 홈 · 「실행 이력」(좁은 창) = 목록
  if(e.target.closest('.js-crumb-mid.crumb-link')){ if(view==='list'){ 보임L=한번; 목록스크롤=0; } view='home'; render(); return; }
  if(e.target.closest('.js-crumb-mid2')){ view='list'; render(); return; }
  if(e.target.closest('.js-crumb-up')){ if(view==='home'){ goPage('화면01_전체목록.html'); return; }
    if(view==='list'){ 보임L=한번; 목록스크롤=0; view='home'; } else view = 좁음() ? 'list' : 'home'; render(); return; }
  if(e.target.closest('.js-more-l')){ 목록스크롤=$('.js-right').scrollTop; 보임L+=한번; renderList(); return; }
  if(e.target.closest('.js-more')){ 보임+=한번; 카드그리기(); return; }
  // 요약 「실패」 — 이력 창을 「실패」로 거른 채 가장 최근 실패를 연다. 좁은 창(목록 화면)은 거르기가 없어 그 실패 하나를 바로 연다
  if(e.target.closest('.js-sum-fail')){ const f=runs().find(r=>r.st==='fail'); if(f){ 거르기='fail'; view='run:'+f.id; render(); } return; }
  const hf=e.target.closest('.js-h-f'); if(hf){ if(거르기!==hf.dataset.f){ 거르기=hf.dataset.f; 보임=한번; 카드그리기(); } return; }   // 이력 카드 거르기 — 보던 실행은 그대로
  // 토글(결정 4007) — 실행 중에 끄거나 실패로 꺼진 것을 켤 때만 확인창(화면①과 같다)
  if(e.target.closest('.js-cf1-no')||e.target===cf1){ cf1.hidden=true; return; }
  if(e.target.closest('.js-cf1-yes')){ cf1.hidden=true; state='off'; view='home'; render(); return; }
  if(e.target.closest('.js-cf2-no')||e.target===cf2){ cf2.hidden=true; return; }
  if(e.target.closest('.js-cf2-yes')){ cf2.hidden=true; state='wait'; view='home'; render(); return; }
  if(e.target.closest('.js-on')){
    if(state==='fail'){ $('.js-cf2-d').textContent='실패 원인이 그대로면 다음 실행도 실패할 수 있습니다. 원인: '+stateInfo().sub; cf2.hidden=false; return; }
    state='wait'; view='home'; render(); return; }
  if(e.target.closest('.js-off')){   // 끄기 = 직접 끔(실패와 다르다 · 2026-09-20)
    if(state==='run'){ cf1.hidden=false; return; }
    state='off'; view='home'; render(); return; }
  // 1회 실행 — 실행 화면으로 넘기지 않는다(2026-09-29 사용자 「실행되면 무조건 상세로 갈 필요 없고 · 허브 화면에서도 다 파악 가능」). 홈 표 맨 위에 「진행 중」 줄이 생긴다
  if(e.target.closest('.js-runnow')){ state='run'; render(); return; }
  if(e.target.closest('.js-stop')){ state='wait'; view='home'; render(); return; }
  const d=e.target.closest('.demo button'); if(d){ state=d.dataset.s; view='home'; render(); return; }
});
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return;
  if(!cf1.hidden){ cf1.hidden=true; return; } if(!cf2.hidden){ cf2.hidden=true; return; }
  if(view!=='home'){ view='home'; render(); return; }   // 이력 화면 나가기(결정 4016 — 최소화가 없어졌다)
});
// 창 폭이 기준(1500)을 넘나들면 다시 그린다 — ‹ 의 갈 곳과 카드가 바뀐다(결정 4018)
let 전좁음=좁음(); window.addEventListener('resize', ()=>{ const n=좁음(); if(n!==전좁음){ 전좁음=n; if(!n && view==='list'){ const r=runs()[0]; if(r) view='run:'+r.id; } render(); } });
render();
</script>

</body></html>
