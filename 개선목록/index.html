<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prixm 개선 목록</title>
<!--
  개선 목록 — 원본은 구글 시트다. 이 페이지는 시트를 읽어 보기 좋게 보여 주기만 한다.
  · 글은 시트에서 고친다(누구나). 30초마다 자동으로 다시 읽는다.
  · 캡처는 이 폴더 캡처/ 에 두고, 시트 캡처 칸에는 「이미지1 / 이미지2」(줄마다 링크)를 적는다.
  · 시트는 「개선 목록」 한 장이다. 메뉴는 「메뉴」 열로 가르고, 페이지 탭은 그 열의 값으로 저절로 생긴다(2026-10-14 사용자 「한 시트에서 공통으로 관리」).
  · 모양은 quiet-chrome v3(qc/ 에 복사본 — 고치지 말 것). 2026-10-14 사용자 「디자인 요소는 이걸로하고 컬러칩은 사용해도됨」
    부품: 단추 .btn · 탭 .tabs/.tab · 입력칸 .input · 빈 상태 .empty. 나머지(항목 · 칩 · 꼬리표 · 크게 보기)는 맞는 부품이 없어 토큰으로 손으로 짰다.
    칩 · 꼬리표 색만 토큰 밖의 값이다(사용자 허락).
-->
<link rel="stylesheet" href="qc/tokens.css">
<link rel="stylesheet" href="qc/components.css">
<script src="qc/focus-mode.js"></script>
<style>
.wrap{max-width:1200px;margin:0 auto;padding:calc(var(--spacing)*4)}
@media (min-width:48rem){.wrap{padding:calc(var(--spacing)*8)}}

/* 머리줄 */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--spacing)*3);flex-wrap:wrap}
.head h1{margin:0 0 calc(var(--spacing)*1);font-size:var(--text-xl);font-weight:600}
.head p{margin:0;font-size:var(--text-sm);color:var(--text-secondary);line-height:1.6}
.tools{display:flex;align-items:center;gap:calc(var(--spacing)*2);flex-wrap:wrap}
/* <a class="btn"> — components.css 가 a 의 밑줄을 안 지운다(단추 카드는 이동이면 a 를 쓰라 함). 이 자리에서만 지운다 */
a.btn{text-decoration:none;color:var(--text-primary)}

/* 연동 표시 — 손으로 짠 것(맞는 부품 없음) */
.sync{display:inline-flex;align-items:center;gap:calc(var(--spacing)*2);height:var(--control-size-lg);padding:0 calc(var(--spacing)*3);
  border-radius:var(--radius-full);background:var(--bg-tertiary);color:var(--text-secondary);font-size:var(--text-xs);
  white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.sync:hover{background:var(--surface-hover)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--text-primary);animation:숨 2s infinite}
.sync.읽는중 i{animation:none;background:var(--text-secondary)}
.sync.멈춤 i{animation:none;background:var(--text-tertiary)}
.sync.오류{color:var(--text-primary);font-weight:500} .sync.오류 i{animation:none;background:var(--text-primary)}
@keyframes 숨{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sync i{animation:none}}

/* 탭 줄 — 탭(부품) + 찾기(입력칸 부품) */
/* 시트 탭 — 가로선 위 밑줄 탭(2026-10-14 사용자 「가로선에 탭 버전으로」). 탭 부품(.tab)은 알약 모양이라 손으로 짰다 */
.row-tabs{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--spacing)*3);flex-wrap:wrap;
  margin:calc(var(--spacing)*6) 0 0;box-shadow:inset 0 -1px 0 var(--border-default)}
.utabs{display:flex;gap:calc(var(--spacing)*1);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.utabs::-webkit-scrollbar{display:none}
.utab{height:var(--control-size-xl);padding:0 calc(var(--spacing)*3);border:0;background:transparent;font:inherit;font-size:var(--text-sm);
  color:var(--text-secondary);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.utab:hover{color:var(--text-primary)}
.utab[aria-selected="true"]{color:var(--text-primary);font-weight:600;box-shadow:inset 0 -2px 0 var(--text-primary)}
.utab .n{margin-left:calc(var(--spacing)*1);color:var(--text-tertiary);font-weight:400;font-variant-numeric:tabular-nums}
.row-tools{display:flex;align-items:center;gap:calc(var(--spacing)*2);flex:1 1 auto;justify-content:flex-end;margin-bottom:calc(var(--spacing)*1.5)}
.row-tools .segmented{flex:none;width:200px}

/* 이미지 크게 — 2026-10-14 사용자: 좌우 최대 폭 없이 · 「기본 정보 | 비포 앤 애프터 / 이미지 크게 |」
   왼쪽 위 = 기본 정보, 왼쪽 아래 = 캡처 크게, 오른쪽 = 지금(비포) · 이렇게(애프터) 를 위아래로 갈라서 */
body.보기-큰 .wrap{max-width:none}
.big{display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,2fr);grid-template-areas:"info ba" "media ba"}
.big-info{grid-area:info;padding:calc(var(--spacing)*4) calc(var(--spacing)*5);min-width:0;display:flex;flex-direction:column;gap:calc(var(--spacing)*2)}
/* 기본 정보 — 한 줄에 다 몰면 줄이 제멋대로 꺾여 읽기 어렵다(2026-10-14 사용자 「보기 너무 불편」).
   ① 꼬리표 줄(메뉴 · No · 꼬리표 · 복사) ② 화면 이름 ③ 영역·위치 ④ 날짜·참고·비고 — 네 줄로 나눈다 */
.bi-top{display:flex;align-items:center;gap:calc(var(--spacing)*1.5);flex-wrap:wrap}
.bi-top .no{min-width:0;margin-right:calc(var(--spacing)*1)}
.bi-top .cp{margin-left:auto}
.bi-ttl{margin:calc(var(--spacing)*1) 0 0;font-size:var(--text-lg);font-weight:600;line-height:1.4}
.bi-links{display:flex;gap:calc(var(--spacing)*2);flex-wrap:wrap;--btn-height:var(--control-size-sm)}
.bi-links .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bi-foot{font-size:var(--text-xs);color:var(--text-tertiary);line-height:1.5;padding:0 calc(var(--spacing)*1)}
.bi-ttlrow{display:flex;align-items:center;gap:calc(var(--spacing)*3);flex-wrap:wrap;margin-top:calc(var(--spacing)*1)}
.bi-ttlrow .bi-ttl{margin:0}
.big-info .meta{display:flex;gap:calc(var(--spacing)*4);flex-wrap:wrap;font-size:var(--text-xs);color:var(--text-tertiary)}
.big-info .meta b{font-weight:400;color:var(--text-secondary)}
.big-media{grid-area:media;padding:0 calc(var(--spacing)*5) calc(var(--spacing)*5);min-width:0}
.big-main{display:flex;align-items:center;justify-content:center;width:100%;padding:0;border:0;border-radius:var(--radius-lg);overflow:hidden;cursor:zoom-in;
  background:var(--bg-tertiary);box-shadow:inset 0 0 0 1px var(--border-default)}
.big-main.shot{height:auto;max-width:none;aspect-ratio:16/9}   /* 캡처 칸 크기 고정(16:9) — 카드마다 높이가 들쭉날쭉하지 않게(2026-10-14 사용자 「크기 고정 어떰」) */
.big-main.shot img{display:block;width:100%;height:100%;max-width:none;object-fit:contain}   /* 칸 안에 비율대로 — 세로로 긴 캡처는 좌우가 빈다 */
.big-none{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;border-radius:var(--radius-lg);
  color:var(--text-tertiary);font-size:var(--text-xs);box-shadow:inset 0 0 0 1px var(--border-default)}
.big-thumbs{display:flex;gap:calc(var(--spacing)*2);margin-top:calc(var(--spacing)*3);flex-wrap:wrap}
.big-thumb{position:relative;height:56px;padding:0;border:0;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;background:var(--bg-primary);
  box-shadow:inset 0 0 0 1px var(--border-default)}
.big-thumb img{display:block;height:100%;width:auto;opacity:.6}
.big-thumb:hover img{opacity:.85}
.big-thumb[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--text-primary)}
.big-thumb[aria-pressed="true"] img{opacity:1}
.big-thumb span{position:absolute;left:calc(var(--spacing)*1);bottom:calc(var(--spacing)*1);font-size:var(--text-xs);line-height:1;
  padding:calc(var(--spacing)*.5) calc(var(--spacing)*1);border-radius:var(--radius-xs);background:var(--text-primary);color:var(--bg-primary)}
.big-ba{grid-area:ba;display:flex;flex-direction:column;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*4) calc(var(--spacing)*5) calc(var(--spacing)*5) 0;min-width:0}
/* 왼쪽(정보 · 캡처)과 오른쪽(Before · After)을 한 카드로 — 2026-10-14 사용자 「하나의 카드로 묶는」. 세로 구분선 대신 안쪽 상자 */
.big-ba .col{padding:calc(var(--spacing)*4);border-radius:var(--radius-xl);background:var(--gray-50);flex:1}
.big-ba .col.to{background:var(--bg-primary);box-shadow:inset 0 0 0 1px var(--border-default)}
.big-ba .k b{font-weight:600;color:var(--text-primary);margin-right:calc(var(--spacing)*1)}
.box-search{flex:1 1 180px;min-width:0;max-width:280px}
.box-search .input{width:100%}

/* 거름 줄 — 탭 아래. 칩은 손으로 짰다(맞는 부품 없음), 색만 값마다 */
.filters{display:flex;align-items:center;gap:calc(var(--spacing)*4);flex-wrap:wrap;
  padding:calc(var(--spacing)*4) 0;margin-bottom:calc(var(--spacing)*2)}
.filters .sp{flex:1}
.grp{display:flex;align-items:center;gap:calc(var(--spacing)*1);flex-wrap:wrap}
.grp .lb{font-size:var(--text-xs);color:var(--text-tertiary);margin-right:calc(var(--spacing)*1)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--spacing)*1.5);height:var(--control-size-sm);padding:0 calc(var(--spacing)*3);
  border:0;border-radius:var(--radius-full);background:transparent;box-shadow:inset 0 0 0 1px var(--border-default);
  font:inherit;font-size:var(--text-xs);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--interactive-bg-secondary-hover)}
.chip[aria-pressed="true"]{background:var(--bg,var(--bg-tertiary));box-shadow:inset 0 0 0 1px var(--bd,transparent);color:var(--c,var(--text-primary));font-weight:500}
.reset{display:inline-flex;align-items:center;gap:calc(var(--spacing)*1);height:var(--control-size-sm);padding:0 calc(var(--spacing)*2.5);
  border:0;border-radius:var(--radius-full);background:transparent;font:inherit;font-size:var(--text-xs);color:var(--text-secondary);cursor:pointer}
.reset:hover{background:var(--interactive-bg-secondary-hover);color:var(--text-primary)}
.reset[disabled]{opacity:.4;cursor:default;background:transparent}
.reset .ic{width:14px;height:14px}

/* 항목 — 손으로 짠 것(.card 는 누르는 타일이라 안 맞음) */
.item{border-radius:var(--radius-2xl);box-shadow:inset 0 0 0 1px var(--border-default);margin-bottom:calc(var(--spacing)*4);overflow:hidden;background:var(--bg-primary)}
.item-hd{display:flex;align-items:center;gap:calc(var(--spacing)*3);padding:calc(var(--spacing)*4) calc(var(--spacing)*5) calc(var(--spacing)*3);flex-wrap:wrap}
.src{font-size:var(--text-xs);color:var(--text-secondary);padding:0 calc(var(--spacing)*2);height:var(--control-size-3xs);display:inline-flex;align-items:center;
  border-radius:var(--radius-sm);background:var(--bg-tertiary);white-space:nowrap}
.no{font-size:var(--text-xs);font-weight:600;color:var(--text-tertiary);min-width:calc(var(--spacing)*5);font-variant-numeric:tabular-nums}
.ttl{font-size:var(--text-sm);font-weight:600}
.ttl .where{font-weight:400;color:var(--text-secondary);margin-left:calc(var(--spacing)*2)}
.tags{display:flex;gap:calc(var(--spacing)*1);margin-left:auto;flex-wrap:wrap;align-items:center}
.tg{display:inline-flex;align-items:center;height:var(--control-size-3xs);padding:0 calc(var(--spacing)*2);border-radius:var(--radius-sm);
  font-size:var(--text-xs);background:var(--bg,var(--bg-tertiary));color:var(--c,var(--text-secondary));white-space:nowrap}
.tg.plain{background:transparent;box-shadow:inset 0 0 0 1px var(--border-default);color:var(--text-secondary)}
.item-body{display:grid;grid-template-columns:1fr calc(var(--spacing)*8) 1fr;border-top:1px solid var(--border-xlight)}
.col{padding:calc(var(--spacing)*4) calc(var(--spacing)*5) calc(var(--spacing)*5);min-width:0}
.col .k{font-size:var(--text-xs);font-weight:600;color:var(--text-tertiary);margin-bottom:calc(var(--spacing)*2);display:flex;align-items:center;gap:calc(var(--spacing)*2)}
.col.to .k{color:var(--text-primary)}
.col .t{font-size:var(--text-sm);line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)}
.shots{display:flex;gap:calc(var(--spacing)*2);flex-wrap:wrap;margin-top:calc(var(--spacing)*3)}
.shot{position:relative;padding:0;border:0;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-tertiary);cursor:zoom-in;
  height:180px;max-width:100%;box-shadow:inset 0 0 0 1px var(--border-default)}
.shot img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain}
.shot:hover{box-shadow:inset 0 0 0 1px var(--border-heavy)}
.shot .z{position:absolute;right:calc(var(--spacing)*1.5);bottom:calc(var(--spacing)*1.5);background:var(--text-primary);color:var(--bg-primary);
  font-size:var(--text-xs);border-radius:var(--radius-sm);padding:calc(var(--spacing)*.5) calc(var(--spacing)*1.5);opacity:0;transition:opacity .15s}
.shot:hover .z{opacity:.85}
.shot.bad{cursor:default;height:auto;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*3);font-size:var(--text-xs);color:var(--text-tertiary)}
.item-ft{display:flex;gap:calc(var(--spacing)*4);flex-wrap:wrap;padding:calc(var(--spacing)*2.5) calc(var(--spacing)*5);
  border-top:1px solid var(--border-xlight);font-size:var(--text-xs);color:var(--text-tertiary)}
.item-ft b{font-weight:400;color:var(--text-secondary)}
.item-ft a{overflow-wrap:anywhere}

/* 복사 — 내 보기에서만. 손으로 짠 작은 단추 */
body:not(.내보기) .cp{display:none!important}
.cp{display:inline-flex;align-items:center;gap:calc(var(--spacing)*1);height:var(--control-size-2xs);padding:0 calc(var(--spacing)*2);
  border:0;border-radius:var(--radius-full);background:transparent;box-shadow:inset 0 0 0 1px var(--border-default);
  font:inherit;font-size:var(--text-xs);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.cp:hover{background:var(--interactive-bg-secondary-hover);color:var(--text-primary)}
.cp .ic{width:12px;height:12px}
.cp.mini{height:var(--control-size-3xs);font-weight:500;opacity:0;transition:opacity .15s}
.col:hover .cp.mini,.cp.mini:focus-visible{opacity:1}
@media (hover:none){.cp.mini{opacity:1}}

.foot{margin-top:calc(var(--spacing)*6);font-size:var(--text-xs);color:var(--text-tertiary)}
.empty{min-height:240px}

/* 알림 · 크게 보기 — 손으로 짠 것 */
.toast{position:fixed;left:50%;bottom:calc(var(--spacing)*7);transform:translate(-50%,8px);background:var(--text-primary);color:var(--bg-primary);
  font-size:var(--text-sm);padding:calc(var(--spacing)*2.5) calc(var(--spacing)*4);border-radius:var(--radius-full);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:200;box-shadow:var(--shadow-200)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lb-bg{position:fixed;inset:0;background:var(--bg-primary);color:var(--text-primary);z-index:100;display:none;flex-direction:column}
.lb-bg.on{display:flex}
.lb-top{display:flex;align-items:center;gap:calc(var(--spacing)*2);padding:calc(var(--spacing)*3) calc(var(--spacing)*4);font-size:var(--text-sm)}
.lb-top .c{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-top .i{color:var(--text-secondary);font-size:var(--text-xs);font-variant-numeric:tabular-nums}
.lb-mid{flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 calc(var(--spacing)*16) calc(var(--spacing)*6)}
.lb-mid img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;border-radius:var(--radius-sm)}
.lb-mid.full{align-items:flex-start;justify-content:flex-start}
.lb-mid.full img{max-width:none;max-height:none;cursor:zoom-out}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%)}
.lb-nav.l{left:calc(var(--spacing)*3)}.lb-nav.r{right:calc(var(--spacing)*3)}
.lb-nav[hidden]{display:none}

@media (max-width:40rem){
  .tools{width:100%}
  .row-tabs{flex-direction:column-reverse;align-items:stretch;gap:calc(var(--spacing)*2)}
  .box-search{max-width:none;flex:none}
  .filters .sp{display:none}
  .item-body{grid-template-columns:1fr}
  .big{grid-template-columns:1fr;grid-template-areas:"info" "media" "ba"}
  .big-ba{padding:0 calc(var(--spacing)*5) calc(var(--spacing)*5)}
  .row-tools{flex-wrap:wrap;justify-content:stretch}
  .row-tools .segmented{width:100%}
  .arrow{transform:rotate(90deg);height:calc(var(--spacing)*5)}
  .shot{height:140px}
  .lb-mid{padding:0 calc(var(--spacing)*2) calc(var(--spacing)*4)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Prixm 개선 목록</h1>
      <p>기획·디자인으로 고칠 곳을 화면별로 모았습니다. 캡처를 누르면 크게 봅니다.<br>
        내용은 구글 시트에서 고치면 이 페이지에 자동으로 반영됩니다.</p>
    </div>
    <div class="tools">
      <span class="sync" id="sync" role="button" tabindex="0" title="시트를 주기적으로 다시 읽습니다. 누르면 지금 바로 확인합니다."><i></i><span id="syncT">시트와 연동 중</span></span>
      <a class="btn" data-variant="outline" data-icon id="toSheet" target="_blank" rel="noopener">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 3h6v6M21 3l-9 9M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>시트에서 고치기</a>
      <button class="btn" data-variant="primary" data-icon id="xlsx" type="button" disabled>
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>엑셀로 내보내기</button>
    </div>
  </div>

  <div class="row-tabs">
    <div class="utabs" role="tablist" id="tabs"></div>
    <div class="row-tools">
      <div class="segmented" role="radiogroup" aria-label="보기 방식" id="view" style="--segmented-count:2">
        <button class="segmented-item" type="button" role="radio" aria-checked="true" data-v="큰">이미지 크게</button>
        <button class="segmented-item" type="button" role="radio" aria-checked="false" data-v="카드">나란히</button>
      </div>
    <div class="box-search"><input class="input" id="srch" placeholder="찾기 — 화면 · 문제 · 제안" aria-label="찾기"></div>
    </div>
  </div>
  <div class="filters" id="bar"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="toast" id="toast" role="status"></div>
<!-- 크게 보기 — .dark 안이라 토큰이 어두운 값으로 바뀐다. 단추는 부품 그대로 -->
<div class="lb-bg dark" id="lb" aria-hidden="true">
  <div class="lb-top"><span class="c" id="lbCap"></span><span class="i" id="lbIdx"></span>
    <a class="btn" data-variant="outline" id="lbOpen" target="_blank" rel="noopener">원본 열기</a>
    <button class="btn" data-size="icon" data-variant="ghost" id="lbX" type="button" aria-label="닫기 (Esc)">

      // 영역·위치 · 날짜는 이 보기에서 표현하지 않는다(2026-10-14 사용자 「일단 여기에서 표현하지말아보자」). 시트 · 복사 · 엑셀에는 그대로

      return `<article class="item big">

          <div class="col to"><div class="k"><b>After</b>이렇게 ${칸복사('개선 제안')}</div><div class="t">${esc(o['개선 제안'])}</div></div>

      <div class="item-hd">${지금탭 === 전체 ? `<span class="src">${esc(o['메뉴'] || '-')}</span>` : ''}<span class="no">${esc(o['No'])}</span>

// ── 크게 보기 ──

// ── 엑셀로 내보내기 — 탭마다 시트 하나, 캡처는 칸에 그림으로 ──
const 엑셀열 = [
  ['메뉴', 11], ['No', 6], ['화면', 16], ['영역·위치', 20], ['구분', 10], ['유형', 10], ['현재 문제', 40], ['현재 캡처', 34],
  ['개선 제안', 40], ['참고 캡처', 34], ['우선순위', 11], ['참고 링크', 30], ['작성자', 10], ['작성일', 12], ['상태', 10], ['담당', 10], ['비고', 24],
];
function 스크립트(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function 그림읽기(src){
  const b = await (await fetch(src)).blob();
  const bmp = await createImageBitmap(b);
  // 엑셀이 무거워지지 않게 가로 900px 이하 PNG 로 줄여 넣는다
  const k = Math.min(1, 900 / bmp.width), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = Object.assign(document.createElement('canvas'), { width: w, height: h });
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return { base64: cv.toDataURL('image/png'), w, h };
}
$('#xlsx').onclick = async () => {
  const b = $('#xlsx'), 원래 = b.innerHTML; b.disabled = true; b.textContent = '만드는 중…';
  try {
    if (!window.ExcelJS) await 스크립트('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
    const wb = new ExcelJS.Workbook();
    for (const 탭 of 탭들){
      // 엑셀 시트 이름에는 / \ ? * : [ ] 를 못 쓴다(「지식/문서」에서 실패했다) → · 로 바꾼다
      const ws = wb.addWorksheet(탭.replace(/[\\/?*:\[\]]/g, '·').slice(0, 31), { views: [{ state: 'frozen', ySplit: 1 }] });
      ws.columns = 엑셀열.map(([h, w]) => ({ header: h, key: h, width: w }));
      const hr = ws.getRow(1); hr.height = 22;
      hr.eachCell(c => { c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3F3F52' } }; c.alignment = { vertical: 'middle', horizontal: 'center' }; });
      for (const o of 데이터[탭] || []){
        const r = ws.addRow(Object.fromEntries(엑셀열.map(([h]) => [h, /캡처$/.test(h) ? '' : (o[h] || '')])));
        r.alignment = { vertical: 'middle', wrapText: true };
        let 높이 = 60;
        for (const 열 of ['현재 캡처', '참고 캡처']){
          const cs = 캡처들(탭, o, 열); if (!cs.length) continue;
          const ci = 엑셀열.findIndex(([h]) => h === 열);
          const 칸폭 = 엑셀열[ci][1] * 7;                 // 열 너비(글자) → 대략 px
          let x = 0;
          for (const c of cs){
            try {
              const g = await 그림읽기(c.src);
              const 높 = 150, 넓 = Math.min(칸폭 - 8, Math.round(g.w * 높 / g.h)), 실높 = Math.round(g.h * 넓 / g.w);
              const id = wb.addImage({ base64: g.base64, extension: 'png' });
              ws.addImage(id, { tl: { col: ci + x * 0.02, row: r.number - 1 + 0.05 }, ext: { width: 넓, height: 실높 } });
              높이 = Math.max(높이, 실높 * 0.75 + 8);   // px → pt
              x++;
            } catch (_) { r.getCell(열).value = (r.getCell(열).value ? r.getCell(열).value + '\n' : '') + c.이름; }
          }
        }
        r.height = 높이;
        const 링크 = o['참고 링크'];
        if (/^https?:\/\/\S+$/.test(링크 || '')) r.getCell('참고 링크').value = { text: 링크, hyperlink: 링크 };
      }
    }
    const buf = await wb.xlsx.writeBuffer();
    const d = new Date(), 날 = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })), download: `Prixm_개선목록_${날}.xlsx` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    alert('엑셀을 만들지 못했습니다: ' + e.message);
  } finally { b.innerHTML = 원래; b.disabled = false; }
};
