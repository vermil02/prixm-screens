/* @조각 _새분석.css */
  /* ① 새 분석 첫 화면 — F2 채택안 (2026-09-22)
     상자 **안**은 파일을 새로 가져오는 길 둘, 상자 **밖**은 이미 있던 걸 다시 쓰는 길 하나.

  /* ★ 2026-09-23 — 화면02 와 같은 정리. 층마다 간격을 **하나**만 둔다.
     전에는 `margin-top` 이 7 · 20 · 6 · 13 · 14 로 흩어져 있어서, 항목을 하나 넣을 때
     위아래 어느 쪽에 얼마를 줘야 하는지 그때마다 따져야 했다.

     면 (20)
      ├ 머리묶음 (7)   말머리 + 말꼬리
      ├ 드롭존 (13)    ├ 드롭머리 (6)  아이콘 + 말
      │                └ 드롭-버튼
      └ 갈래묶음 (8)   혹은 + 「최근 분석한 파일에서 선택」

     덤 — 이 짜임이라야 IR 로 뽑을 때 오토레이아웃이 잡힌다
     (`업무도구/htmlcanvas/README.md`). 전에는 `.면` 과 `.드롭존` 이 「간격 불균등」으로 포기됐다. */
  .면{flex:1; min-height:0; display:flex; flex-direction:column; gap:20px;
    align-items:center; justify-content:center; text-align:center; padding:34px 22px;}
  .머리묶음{display:flex; flex-direction:column; gap:7px;}
  .말머리{font-size:18px; font-weight:600; letter-spacing:-0.5px; color:#222;}
  .말꼬리{font-size:var(--font-size-13); color:var(--gray-500); line-height:1.6;}

  /* 크기 — htmlcanvas 에서 잡은 값 (2026-09-26). 전에는 max-width 가 330 이었다.
     폭은 **늘어나되 600 까지만** — 좁은 창에서는 같이 줄어든다. */
  .드롭존{display:flex; flex-direction:column; gap:13px; justify-content:center;
    width:100%; max-width:600px; height:250px; box-sizing:border-box;
    border:1px dashed var(--color-primitive-purple-900, #6d28d9); border-radius:10px;
    padding:24px 18px; background:#fcfcff;}
  .드롭머리{display:flex; flex-direction:column; gap:6px;}
  .드롭-아이콘{display:flex; justify-content:center;
    color:var(--color-primitive-purple-900, #6d28d9);}
  .드롭-말{font-size:var(--font-size-13); color:var(--gray-600);}
  .드롭-버튼{display:flex; gap:7px; justify-content:center; flex-wrap:wrap;}
  .갈래묶음{display:flex; flex-direction:column; gap:8px;
    width:100%; max-width:330px; align-items:center;}

  /* 「혹은」 — 좌우 가로선. 상자 밖의 길이라 눈에 덜 띄는 자리가 맞다 */
  .혹은{font-size:var(--font-size-11); color:var(--gray-500);
    position:relative; width:100%;}
  .혹은::before, .혹은::after{content:""; position:absolute; top:50%; width:calc(50% - 22px);
    height:1px; background:var(--border-subtle);}
  .혹은::before{left:0;} .혹은::after{right:0;}
  /* 「최근 분석한 파일에서 선택」 — 글자 링크에서 **버튼**으로 바꿨다(2026-09-22 사용자).
     상자 **밖**에 두는 것은 그대로다(F2) — 바깥이라는 자리가 「이미 있던 걸 다시 쓴다」를 말한다.
     달라진 것은 **누를 수 있게 생겼느냐**뿐이다. 셋 다 누르면 고르는 레이어가 뜨는 같은 층인데
     혼자만 링크라 층이 다른 것처럼 보였다. */
  .js-최근{min-width:200px; justify-content:center;}

/* ① 새 분석 — 파일을 고르면 ②③(데이터 고르기 · 분석 기법)으로 간다.
   입구 셋이 같은 곳으로 가는 것이 맞다 — 다른 것은 *파일이 어디 있느냐*뿐이고,
   고른 뒤에 할 일(데이터를 다듬고 방법을 고르는 것)은 같다.

   2026-09-22 — 「지식/문서에서 선택」과 「최근 분석한 파일에서 선택」에 **고르는 레이어**를 붙였다.
   라이브 규격 그대로다(`부품/레이어/README.md` 에 실측표). 「파일 선택」만 레이어가 없다 —
   그것은 **운영체제의 파일 창**이 뜨는 자리라 우리가 그릴 것이 없다. */
(function () {
  var 다음 = "../데이터분석/정본/화면02_데이터/화면02_데이터.html?tab=data";

  /* ── 보여 줄 값 — 시안용. 실제로는 서버가 준다 ────────────────────── */
  var 폴더들 = [
    { 이름: "00.인사규정" },
    { 이름: "01.기술문서", 아래: ["설계"] },
    { 이름: "02.표와데이터", 파일: [
        { 이름: "안전점검_2026상반기.xlsx", 곁: "측정 결과 · 7행 × 6열" },
        { 이름: "측정값_월별.xlsx", 곁: "측정 결과 · 124행 × 8열" },
        { 이름: "부서별_위험등급.csv", 곁: "집계 · 42행 × 4열" } ] },
    { 이름: "03.분량테스트" },
    { 이름: "04.빈폴더" },
    { 이름: "05.첨부파일", 아래: ["작은파일", "중간파일", "큰파일"] },
    { 이름: "내 문서" }
  ];
  var 최근들 = [
    { 이름: "안전점검_2026상반기.xlsx", 곁: "어제 · 기술통계" },
    { 이름: "측정값_월별.xlsx",        곁: "3일 전 · 추세" },
    { 이름: "부서별_위험등급.csv",      곁: "5일 전 · 교차표" },
    { 이름: "설비_가동시간_2025.xlsx",  곁: "지난주 · 그룹 비교" },
    { 이름: "품질검사_로그.csv",        곁: "지난주 · 이상치" },
    { 이름: "원자재_입고내역.xlsx",     곁: "2주 전 · 기술통계" }
  ];

  function 가기() { location.href = 다음; }

  /* ── 레이어 열고 닫기 ─────────────────────────────────────────────── */
  function 열기(레이어) {
    레이어.hidden = false;
    var 첫 = 레이어.querySelector("input");
    if (첫) 첫.focus();
  }
  function 다닫기() {
    document.querySelectorAll(".레이어덮개").forEach(function (x) { x.hidden = true; });
  }
  /* 덮개를 눌러도 닫힌다 — 상자 안쪽 클릭은 덮개까지 올라오지 않게 막는다 */
  document.querySelectorAll(".레이어덮개").forEach(function (덮) {
    덮.addEventListener("click", function (e) { if (e.target === 덮) 다닫기(); });
  });
  document.addEventListener("click", function (e) {
    if (e.target.closest(".js-닫기")) 다닫기();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") 다닫기(); });

  /* ── 레이어 ① 문서에서 불러오기 ───────────────────────────────────── */
  var 문서레이어 = document.querySelector(".js-문서레이어");
  var 나무 = document.querySelector(".js-나무");
  var 파일목록 = document.querySelector(".js-파일목록");
  var 확인 = document.querySelector(".js-문서확인");

  나무.innerHTML = 폴더들.map(function (f, i) {
    var 줄 = '<button type="button" class="나무줄" data-폴더="' + i + '">' +

    (f.아래 || []).forEach(function (아) {
      줄 += '<button type="button" class="나무줄 깊게">' +
            '<span class="나무아이콘"><i data-ico="폴더" data-크기="16"></i></span>' + 아 + '</button>';
    });
    return 줄;
  }).join("");
  PX_ICO_채우기(나무);

  function 고른수맞추기() {
    var n = 파일목록.querySelectorAll(".검색줄.지금").length;
    document.querySelector(".js-고른수").textContent = n;
    확인.classList.toggle("state-disabled", n === 0);
  }

  나무.addEventListener("click", function (e) {
    var 줄 = e.target.closest(".나무줄");
    if (!줄 || !줄.dataset["폴더"]) return;
    나무.querySelectorAll(".나무줄").forEach(function (x) { x.classList.remove("지금"); });
    줄.classList.add("지금");
    var 파일 = 폴더들[+줄.dataset["폴더"]].파일 || [];
    파일목록.innerHTML = 파일.length
      ? 파일.map(function (p) {
          return '<button type="button" class="검색줄">' +
                 '<span class="줄아이콘"><i data-ico="파일표" data-크기="16"></i></span>' +
                 '<span class="줄이름">' + p.이름 + '</span>' +
                 '<span class="줄곁">' + p.곁 + '</span></button>';
        }).join("")
      : '<div class="빈말">이 폴더에는 분석할 수 있는 파일이 없습니다.</div>';
    PX_ICO_채우기(파일목록);
    고른수맞추기();
  });

  /* 파일 한 줄 고르기 — 지금은 하나만 고른다(분석은 파일 하나를 받는다) */
  파일목록.addEventListener("click", function (e) {
    var 줄 = e.target.closest(".검색줄");
    if (!줄) return;
    파일목록.querySelectorAll(".검색줄").forEach(function (x) { x.classList.remove("지금"); });
    줄.classList.add("지금");
    고른수맞추기();
  });
  확인.addEventListener("click", function () {
    if (!this.classList.contains("state-disabled")) 가기();
  });

  /* ── 레이어 ② 최근 분석한 파일 ────────────────────────────────────── */
  var 최근레이어 = document.querySelector(".js-최근레이어");
  var 최근목록 = document.querySelector(".js-최근목록");
  var 최근머리 = document.querySelector(".js-최근머리");

  function 최근그리기(찾는말) {
    var 말 = (찾는말 || "").trim();
    var 걸린 = 말 ? 최근들.filter(function (p) { return p.이름.indexOf(말) >= 0; }) : 최근들;
    최근머리.textContent = 말 ? "검색 결과 " + 걸린.length + "개" : "최근 분석한 파일";
    최근목록.innerHTML = 걸린.length
      ? 걸린.map(function (p) {
          return '<button type="button" class="검색줄">' +
                 '<span class="줄아이콘"><i data-ico="파일표" data-크기="16"></i></span>' +
                 '<span class="줄이름">' + p.이름 + '</span>' +
                 '<span class="줄곁">' + p.곁 + '</span></button>';
        }).join("")
      : '<div class="빈말" style="height:80px">찾는 파일이 없습니다.</div>';
    PX_ICO_채우기(최근목록);
  }
  최근그리기("");
  document.querySelector(".js-최근검색").addEventListener("input", function () { 최근그리기(this.value); });
  /* 최근 목록은 **누르면 바로 간다** — 이미 분석해 본 파일이라 더 물을 것이 없다.
     그래서 이 레이어에는 바닥 버튼이 없다(문서 쪽은 폴더를 뒤져야 해서 「파일 추가」가 필요하다). */
  최근목록.addEventListener("click", function (e) {
    if (e.target.closest(".검색줄")) 가기();
  });

  /* ── 입구 셋 ───────────────────────────────────────────────────────── */
  document.querySelector(".js-파일").addEventListener("click", 가기);
  document.querySelector(".js-문서").addEventListener("click", function () { 열기(문서레이어); });
  document.querySelector(".js-최근").addEventListener("click", function () { 열기(최근레이어); });
})();
/* @끝 _새분석.js */
</script>
</body></html>
