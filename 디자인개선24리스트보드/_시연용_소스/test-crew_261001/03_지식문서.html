.relay-fab.bl{left:14px;bottom:14px;flex-direction:row-reverse}

/* 버튼 — 아이콘 위, 한글 명칭 아래(작게). 원형 하나가 과녁이 되도록 안에 넣는다. */

  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;position:relative;z-index:1;flex:none;
  box-shadow:0 10px 24px -8px rgba(0,0,0,.55);transition:transform .15s,background .15s}

.relay-btn b{font:700 9.5px/1 inherit;letter-spacing:-.02em;opacity:.92}

/* 한 판에 **가로로** 담는다. 글자를 옆에 두면 칸마다 폭이 달라 죽은 공간이 생겼다 —
   아이콘 위, 작은 글자 아래로 세우면 칸이 정사각에 가까워지고 판이 내용에 딱 맞는다.
   버튼 바로 위 구석에 머물러, 예전처럼 화면 오른쪽 한가운데를 가로지르지 않는다. */
